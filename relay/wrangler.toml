# Cloudflare Worker 배포 설정 (relay/ 폴더 기준)
# 이 저장소는 Cloudflare Workers Builds와 연결되어 있다: main에 relay/ 변경이 올라오면 자동으로 배포된다 (Root directory: relay)
# name은 대시보드의 Worker 이름과 같아야 기존 Worker(와 저장된 Secret)를 그대로 덮어쓴다.
name = "lucky-feather-d3e9"
main = "worker.js"
compatibility_date = "2025-09-01"
# 대시보드에서 넣은 일반 변수(ALLOWED_ORIGINS 등)를 배포할 때 지우지 않는다. Secret은 원래 유지된다.
keep_vars = true

# Worker를 미국 동부 근처에서 실행하도록 고정한다.
# 친구 요청이 홍콩(HKG)처럼 Gemini가 막는 지역의 데이터센터로 가면 "User location is not supported"가 나기 때문이다.
[placement]
region = "gcp:us-east4"

# 계정과 세계관 저장소 (Cloudflare D1). 테이블은 Worker가 첫 요청 때 만든다.
[[d1_databases]]
binding = "DB"
database_name = "worldwiki-db"
database_id = "3ce1b198-c233-45c6-8b46-8c0aa8638327"

# 계정별 AI 작업 큐. alarm이 HTTP 연결과 독립적으로 실행하고 결과를 24시간 보관한다.
[[durable_objects.bindings]]
name = "AI_JOBS"
class_name = "AiJobs"

[[migrations]]
tag = "v1-ai-jobs"
new_sqlite_classes = ["AiJobs"]
