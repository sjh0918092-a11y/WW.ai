<!doctype html><html><head><meta charset=utf8><meta name=viewport content="width=device-width,initial-scale=1,viewport-fit=cover"><style>:root{color-scheme:light;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}html{scroll-padding-top:env(safe-area-inset-top,0px)}body{margin:0;padding:0;font:14px -apple-system,BlinkMacSystemFont,sans-serif;background:#fff;color:#000}img{max-width:100%}[hidden]:not([hidden=until-found i]){display:none!important}</style></head><body>
<title>WorldWiki.ai</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500&family=IBM+Plex+Sans+KR:wght@400;500;600&family=Noto+Serif+KR:wght@600;700&display=swap">
<style>
/* Layout: wiki shell — sticky search bar, narrow navigation rail, white article sheet with floated infobox. Red links = 미작성 문서. */
:root{
  --paper:#F3F5F8; --sheet:#FFFFFF; --ink:#17202A; --muted:#5D6774; --line:#DBE0E7; --tint:#ECF0F5;
  --link:#2353BF; --red:#B4372B; --accent:#17202A; --on-accent:#FFFFFF;
  --warn-bg:#FFF3DC; --warn-fg:#7E4B00; --ok:#2E7A4C; --hl:#FFF4C2;
  --f-display:"Noto Serif KR","Nanum Myeongjo","Apple SD Gothic Neo",serif;
  --f-body:"IBM Plex Sans KR","Apple SD Gothic Neo","Malgun Gothic",system-ui,sans-serif;
  --f-mono:"IBM Plex Mono",ui-monospace,"SFMono-Regular",Menlo,monospace;
  --r:6px;
}
@media (prefers-color-scheme: dark){ :root:not([data-theme="light"]){
  --paper:#0E1217; --sheet:#151A21; --ink:#E4E9EF; --muted:#98A2AF; --line:#29313B; --tint:#1C232C;
  --link:#88A9FF; --red:#F08A7D; --accent:#E4E9EF; --on-accent:#0E1217;
  --warn-bg:#382A10; --warn-fg:#F2C47C; --ok:#6CC491; --hl:#3A3413; color-scheme:dark }}
:root[data-theme="dark"]{
  --paper:#0E1217; --sheet:#151A21; --ink:#E4E9EF; --muted:#98A2AF; --line:#29313B; --tint:#1C232C;
  --link:#88A9FF; --red:#F08A7D; --accent:#E4E9EF; --on-accent:#0E1217;
  --warn-bg:#382A10; --warn-fg:#F2C47C; --ok:#6CC491; --hl:#3A3413; color-scheme:dark }

*{box-sizing:border-box}
body{background:var(--paper);color:var(--ink);font-family:var(--f-body);font-size:14px;line-height:1.6;-webkit-font-smoothing:antialiased}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:10;background:var(--sheet)}
button,input,textarea,select{font:inherit;color:inherit}
a{color:var(--link)}
:focus-visible{outline:2px solid var(--link);outline-offset:2px}
.wrap{padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}

/* top bar */
.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:5;background:var(--sheet);border-bottom:1px solid var(--line)}
.top-in{max-width:1180px;margin:0 auto;display:flex;align-items:center;gap:16px;padding-block:10px;flex-wrap:wrap}
.brand{display:flex;align-items:baseline;gap:10px;min-width:0;background:none;border:0;padding:0;cursor:pointer;text-align:left}
.brand b{font-family:var(--f-display);font-weight:700;font-size:19px;letter-spacing:-.01em;white-space:nowrap}
.brand span{font-family:var(--f-mono);font-size:11.5px;color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:40vw}
.search{position:relative;margin-left:auto;flex:1 1 260px;max-width:420px}
.search input{width:100%;border:1px solid var(--line);background:var(--paper);border-radius:var(--r);padding:8px 12px;font-size:14px}
.search input:disabled{opacity:.55}
.sugg{position:absolute;left:0;right:0;top:calc(100% + 4px);background:var(--sheet);border:1px solid var(--line);border-radius:var(--r);box-shadow:0 8px 24px rgb(0 0 0 / .12);overflow:hidden}
.sugg button{display:flex;justify-content:space-between;gap:12px;width:100%;text-align:left;background:none;border:0;padding:8px 12px;cursor:pointer}
.sugg button:hover,.sugg button:focus-visible{background:var(--tint)}
.sugg small{font-family:var(--f-mono);color:var(--muted);font-size:11px}

/* shell */
.shell{max-width:1180px;margin:0 auto;display:grid;grid-template-columns:210px minmax(0,1fr);gap:24px;padding-block:24px 64px}
.side{display:flex;flex-direction:column;gap:20px;font-size:13.5px}
.side h4{margin:0 0 6px;font-family:var(--f-mono);font-weight:500;font-size:11px;letter-spacing:.08em;text-transform:uppercase;color:var(--muted)}
.side ul{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:2px}
.side li button,.side li a{display:block;width:100%;text-align:left;background:none;border:0;padding:3px 0;cursor:pointer;color:var(--link);text-decoration:none;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.side li button:hover{text-decoration:underline}
.side li button.cur{color:var(--ink);font-weight:600}
.stat{font-family:var(--f-mono);font-size:12px;color:var(--muted);display:flex;flex-direction:column;gap:2px}
.stat em{font-style:normal;color:var(--ink)}
.genpill{display:flex;align-items:center;gap:8px;font-size:12.5px;color:var(--muted)}
.dot{width:8px;height:8px;border-radius:50%;background:var(--link);animation:pulse 1.2s ease-in-out infinite;flex:none}
@keyframes pulse{50%{opacity:.25}}
main{min-width:0}

/* sheet */
.sheet{background:var(--sheet);border:1px solid var(--line);border-radius:var(--r);padding:28px 32px 36px}
.crumb{font-family:var(--f-mono);font-size:11.5px;color:var(--muted);letter-spacing:.02em;display:flex;gap:10px;flex-wrap:wrap}
h1.t{font-family:var(--f-display);font-weight:700;font-size:30px;line-height:1.25;letter-spacing:-.015em;margin:6px 0 4px;text-wrap:balance;padding-bottom:12px;border-bottom:1px solid var(--line)}
.tools{display:flex;gap:8px;flex-wrap:wrap;margin:12px 0 4px}
.btn{display:inline-flex;align-items:center;gap:6px;border:1px solid var(--line);background:var(--sheet);border-radius:var(--r);padding:6px 12px;font-size:13px;cursor:pointer;color:var(--ink)}
.btn:hover{background:var(--tint)}
.btn:disabled{opacity:.5;cursor:not-allowed}
.btn.pri{background:var(--accent);color:var(--on-accent);border-color:var(--accent);font-weight:600}
.btn.pri:hover{opacity:.9}
.btn.dng{color:var(--red)}
.confirm{display:inline-flex;align-items:center;gap:8px;flex-wrap:wrap;font-size:13px;background:var(--tint);border-radius:var(--r);padding:4px 4px 4px 12px}

.article{font-size:15px;line-height:1.8}
.lead{margin:18px 0 0}
.infobox{float:right;width:280px;margin:16px 0 16px 24px;border:1px solid var(--line);border-radius:var(--r);font-size:13px;line-height:1.55;overflow:hidden;background:var(--sheet)}
.infobox .ih{background:var(--tint);padding:10px 12px;font-family:var(--f-display);font-weight:700;font-size:15px;text-align:center}
.portrait{padding:10px;text-align:center;border-bottom:1px solid var(--line)}
.portrait img{display:block;max-width:100%;max-height:400px;width:auto;height:auto;margin:0 auto;object-fit:contain}
.portrait-menu{position:relative;align-self:flex-start}
.portrait-menu>summary{list-style:none}
.portrait-menu>summary::-webkit-details-marker{display:none}
.portrait-menu>summary::after{content:"▾";font-size:10px;color:var(--muted)}
.portrait-actions{position:absolute;top:calc(100% + 4px);left:0;z-index:4;min-width:170px;padding:6px;border:1px solid var(--line);border-radius:var(--r);background:var(--sheet);box-shadow:0 6px 20px rgb(0 0 0 / .12)}
.portrait-actions .btn{display:flex;width:100%;border:0;text-align:left}
.infobox .ity{font-family:var(--f-mono);font-size:11px;color:var(--muted);text-align:center;padding:4px 0 2px;border-bottom:1px solid var(--line)}
.infobox table{width:100%;border-collapse:collapse}
.infobox th,.infobox td{padding:6px 10px;border-top:1px solid var(--line);vertical-align:top;text-align:left}
.infobox tr:first-child th,.infobox tr:first-child td{border-top:0}
.infobox th{width:36%;font-weight:600;color:var(--muted);font-size:12.5px}
.toc{display:inline-block;border:1px solid var(--line);background:var(--paper);border-radius:var(--r);padding:10px 16px 12px;margin:20px 0 4px;font-size:13.5px;min-width:200px;max-width:100%}
.toc b{font-family:var(--f-mono);font-weight:500;font-size:11px;letter-spacing:.08em;color:var(--muted)}
.toc ol{margin:6px 0 0;padding-left:20px}
.toc button{background:none;border:0;padding:1px 0;cursor:pointer;color:var(--link);text-align:left}
.article h2{font-family:var(--f-display);font-weight:700;font-size:21px;line-height:1.35;margin:30px 0 8px;padding-bottom:6px;border-bottom:1px solid var(--line);text-wrap:balance;clear:none}
.article h2 .n{color:var(--link);margin-right:8px;font-variant-numeric:tabular-nums}
.article h3{font-size:16px;margin:18px 0 4px}
.article p{margin:0 0 12px}
.article ul{margin:0 0 12px;padding-left:22px}
.article del{color:var(--muted)}
.article ul ul{margin:2px 0 4px;padding-left:20px;list-style:circle}
.article blockquote{display:table;max-width:100%;margin:6px 0 16px;padding:12px 18px;border:1px dashed var(--line);border-radius:var(--r);background:var(--paper);font-family:var(--f-display);font-weight:600;font-size:15px;line-height:1.7}
.article blockquote cite{display:block;margin-top:8px;padding-top:6px;border-top:1px solid var(--line);font-family:var(--f-body);font-style:normal;font-weight:400;font-size:13px}
.article h3.sh{font-family:var(--f-display);font-weight:700;font-size:17px;margin:22px 0 6px;padding-bottom:4px;border-bottom:1px solid var(--line)}
.article h3.sh .n{color:var(--link);margin-right:8px;font-variant-numeric:tabular-nums}
.ed .ed-2{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,2fr);gap:0 14px}
.ed textarea{font-size:14px;line-height:1.7}
.ed #edBody,.ed #edNavbox,.ed #edInfobox{font-family:var(--f-mono),var(--f-body);font-size:13.5px}
.ed-help{margin:8px 0 0;font-size:13px}
.ed-help summary{cursor:pointer;color:var(--link)}
.ed-help .kv{margin:8px 0 0;padding:10px 12px;border:1px solid var(--line);border-radius:var(--r);background:var(--paper)}
.ed-help dt{font-family:var(--f-mono);color:var(--ink)}
@media (max-width:560px){.ed .ed-2{grid-template-columns:minmax(0,1fr)}}
.cfpanel{margin:14px 0 4px;padding:14px;border:1px solid var(--warn-fg);border-radius:var(--r);background:var(--warn-bg);color:var(--ink);display:flex;flex-direction:column;gap:10px}
.cfpanel>b{color:var(--warn-fg)}
.cfpanel .note{margin:0}
.cf{background:var(--sheet);border:1px solid var(--line);border-radius:var(--r);padding:10px 12px;display:flex;flex-direction:column;gap:4px;font-size:13.5px}
.cf-h{font-weight:600}
.cf-old,.cf-new{display:grid;grid-template-columns:52px minmax(0,1fr);gap:8px}
.cf-old span,.cf-new span{font-family:var(--f-mono);font-size:11px;color:var(--muted);padding-top:2px}
.cf-old{color:var(--muted)}
.cf-ch{display:flex;gap:6px;align-items:center;margin-top:6px;font-size:13px}
.cf .txt{margin-top:2px}
.rwbox{margin:10px 0 4px;padding:12px 14px;border:1px solid var(--line);border-radius:var(--r);background:var(--paper);max-width:640px}
.rwbox .note{margin:8px 0 0}
.rels{clear:both;margin-top:28px}
.rels h3{font-family:var(--f-display);font-size:17px;margin:0 0 8px;padding-bottom:4px;border-bottom:1px solid var(--line)}
.rels ul{list-style:none;margin:0;padding:0;display:grid;grid-template-columns:repeat(auto-fill,minmax(230px,1fr));gap:10px}
.rels li{border:1px solid var(--line);border-radius:var(--r);padding:10px 12px;display:flex;flex-direction:column;gap:4px;font-size:13.5px;min-width:0}
.rels li.sup{opacity:.55}
.rels .rel-h{display:flex;flex-wrap:wrap;gap:6px 8px;align-items:baseline;font-weight:600}
.rels .rel-k{font-weight:400;font-size:12px;color:var(--muted);border:1px solid var(--line);border-radius:999px;padding:0 8px}
.rels p{margin:0;line-height:1.6}
.navbox{margin:12px 0 0;border:1px solid var(--line);border-radius:var(--r);overflow:hidden;background:var(--sheet)}
.navbox summary{display:flex;align-items:center;justify-content:center;gap:8px;padding:8px 12px;background:var(--tint);cursor:pointer;list-style:none;font-weight:600;font-size:14px;text-align:center}
.navbox summary::-webkit-details-marker{display:none}
.navbox .nb-n{font-family:var(--f-mono);font-weight:400;font-size:11px;color:var(--muted);border:1px solid var(--line);border-radius:999px;padding:0 7px}
.navbox .nb-tog::before{content:"[펼치기]";font-weight:400;font-size:12px;color:var(--link)}
.navbox[open] .nb-tog::before{content:"[접기]"}
.nb-body{display:flex;flex-direction:column}
.nb-row{display:grid;grid-template-columns:minmax(90px,150px) minmax(0,1fr);border-top:1px solid var(--line)}
.nb-l{padding:8px 10px;background:var(--paper);font-weight:600;font-size:12.5px;color:var(--muted);border-right:1px solid var(--line)}
.nb-row ul{list-style:none;margin:0;padding:8px 12px;display:flex;flex-wrap:wrap;gap:4px 18px;font-size:13.5px;min-width:0}
.nb-row li{display:flex;flex-direction:column;line-height:1.35;min-width:0}
.nb-row li small{color:var(--muted);font-size:11.5px}
.nb-row li.me b{color:var(--ink)}
.nb-src{border-top:1px solid var(--line);padding:6px 12px;font-size:12px;text-align:right}
@media (max-width:560px){.nb-row{grid-template-columns:minmax(0,1fr)}.nb-l{border-right:0;border-bottom:1px solid var(--line)}}
.nf-h{font-family:var(--f-display);font-weight:700;font-size:20px;margin:20px 0 4px}
.cats{display:flex;flex-wrap:wrap;gap:4px 0;align-items:center;margin:10px 0 0;padding:6px 10px;border:1px solid var(--line);border-radius:var(--r);font-size:13px}
.cats b{font-weight:600;margin-right:8px}
.cats span{color:var(--link)}
.cats span+span::before{content:"|";color:var(--line);margin:0 8px}
.toc ul{list-style:none;margin:6px 0 0;padding:0}
.toc li.sub{padding-left:22px}
.toc .n{color:var(--link);font-variant-numeric:tabular-nums}
.notice{display:flex;flex-direction:column;gap:4px;margin:16px 0 0;padding:10px 14px;border:1px solid var(--line);border-radius:var(--r);background:var(--tint);font-size:13.5px;line-height:1.6}
a.wl{text-decoration:none}
a.wl:hover{text-decoration:underline}
a.wl.new{color:var(--red);-webkit-touch-callout:none}
a.wl.new.pressing{-webkit-user-select:none;user-select:none}   /* 길게 누르는 동안에만 글자 선택을 막는다. 드래그 선택에는 빨간 링크도 들어간다 */
sup.fn a{font-size:11px;text-decoration:none;font-family:var(--f-mono)}
.fns{clear:both;margin-top:28px;padding-top:12px;border-top:1px solid var(--line);font-size:13px;color:var(--muted)}
.fns ol{padding-left:22px;margin:6px 0 0}
.fns li:target,.fns li.flash{background:var(--hl)}
.meta-foot{clear:both;margin-top:28px;display:flex;flex-direction:column;gap:10px;font-size:13px}
.meta-foot .box{border:1px solid var(--line);border-radius:var(--r);padding:8px 12px;background:var(--paper)}
.meta-foot b{font-weight:600;margin-right:6px}
.chips{display:inline-flex;gap:6px;flex-wrap:wrap}

.banner{border-radius:var(--r);padding:12px 14px;font-size:13.5px;margin:14px 0}
.banner.warn{background:var(--warn-bg);color:var(--warn-fg)}
.banner.ok{background:var(--tint);color:var(--ok)}
.banner ul{margin:6px 0 0;padding-left:18px}
.banner li{margin-bottom:4px}
.banner .sev{font-family:var(--f-mono);font-size:11px;font-weight:500;margin-right:6px}

/* generating */
.gen-live{font-family:var(--f-mono);font-size:12px;color:var(--muted);display:flex;gap:12px;flex-wrap:wrap;align-items:center}
.promise{margin:18px 0;border:1px dashed var(--line);border-radius:var(--r);padding:12px 14px;font-size:13.5px}
.promise h5{margin:0 0 6px;font-family:var(--f-mono);font-weight:500;font-size:11px;letter-spacing:.08em;color:var(--muted)}
.promise ul{margin:0;padding-left:18px}
.heads{margin:18px 0 0;padding:0;list-style:none;display:flex;flex-direction:column;gap:8px}
.heads li{font-family:var(--f-display);font-weight:600;font-size:17px;animation:in .3s ease-out}
@keyframes in{from{opacity:.2;transform:translateY(4px)}}
.sk{height:11px;border-radius:4px;background:var(--tint);margin:10px 0;animation:pulse 1.6s ease-in-out infinite}
.sk:nth-child(2){width:92%}.sk:nth-child(3){width:78%}.sk:nth-child(4){width:85%}

/* home */
.home{display:grid;grid-template-columns:minmax(0,1.15fr) minmax(0,1fr);gap:24px;align-items:start}
.home h2{font-family:var(--f-display);font-size:22px;margin:0 0 4px;text-wrap:balance}
.sub{color:var(--muted);margin:0 0 16px;max-width:60ch}
label.lb{display:block;font-weight:600;font-size:13px;margin:16px 0 6px}
input.txt{width:100%;border:1px solid var(--line);background:var(--paper);border-radius:var(--r);padding:9px 12px;font-size:14px}
textarea{width:100%;border:1px solid var(--line);background:var(--paper);border-radius:var(--r);padding:10px 12px;line-height:1.65;resize:vertical;font-size:14px}
.stabs{display:flex;flex-direction:column;gap:8px;margin:0 0 8px}
.stabs-row{display:flex;flex-wrap:wrap;align-items:center;gap:6px}
.stab{border:1px solid var(--line);background:var(--sheet);border-radius:999px;padding:4px 12px;font-size:12.5px;cursor:pointer;color:var(--ink)}
.stab:hover{background:var(--tint)}
.stab[aria-selected="true"]{background:var(--accent);color:var(--on-accent);border-color:var(--accent)}
.stab[data-stab="own"]{font-weight:600}
.dice{display:flex;flex-direction:column;gap:8px;margin:0 0 10px;padding:12px;border:1px solid var(--line);border-radius:var(--r);background:var(--paper)}
.die{display:grid;grid-template-columns:56px minmax(0,1fr) auto;gap:10px;align-items:center;background:var(--sheet);border:1px solid var(--line);border-radius:var(--r);padding:8px 10px}
.die-l{font-family:var(--f-mono);font-size:11px;color:var(--muted);letter-spacing:.06em}
.die-v{font-family:var(--f-display);font-weight:700;font-size:15.5px;line-height:1.4;min-width:0}
textarea.die-v{display:block;width:100%;border:1px solid transparent;border-radius:4px;background:transparent;padding:3px 6px;margin:-3px 0;color:var(--ink);resize:none;overflow:hidden;font-size:15.5px;line-height:1.4;field-sizing:content;word-break:keep-all}
textarea.die-v:hover{border-color:var(--line)}
textarea.die-v:focus{border-color:var(--link);background:var(--paper);outline:none}
.die-lock{border:1px solid var(--line);background:var(--sheet);border-radius:999px;padding:2px 10px;font-size:12px;cursor:pointer;color:var(--muted)}
.die-lock[aria-pressed="true"]{background:var(--accent);color:var(--on-accent);border-color:var(--accent)}
.whatif{margin:0 0 10px}
.wi-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(200px,1fr));gap:8px}
.wi{display:flex;flex-direction:column;gap:2px;text-align:left;border:1px solid var(--line);background:var(--sheet);border-radius:var(--r);padding:10px 12px;cursor:pointer;color:var(--ink);font-family:var(--f-display);font-weight:600;font-size:14.5px;line-height:1.45}
.wi span{font-family:var(--f-mono);font-weight:400;font-size:10.5px;color:var(--muted);letter-spacing:.08em}
.wi:hover:not(:disabled){border-color:var(--ink);background:var(--tint)}
.wi:disabled{opacity:.5;cursor:not-allowed}
.stab-sep{font-family:var(--f-mono);font-size:11px;color:var(--muted);letter-spacing:.06em;margin-right:4px}
.ex{display:flex;gap:6px;flex-wrap:wrap;margin-top:8px}
.chip{border:1px solid var(--line);background:var(--sheet);border-radius:999px;padding:4px 11px;font-size:12.5px;cursor:pointer;color:var(--ink)}
.chip:hover{background:var(--tint)}
.chip[aria-pressed="true"]{background:var(--accent);color:var(--on-accent);border-color:var(--accent)}
.row{display:flex;gap:10px;align-items:center;flex-wrap:wrap;margin-top:18px}
.note{font-size:12.5px;color:var(--muted)}
.wlist{display:flex;flex-direction:column;gap:10px}
.wcard{border:1px solid var(--line);background:var(--sheet);border-radius:var(--r);padding:14px 16px;display:flex;flex-direction:column;gap:6px}
.wcard button.open{background:none;border:0;padding:0;text-align:left;cursor:pointer;font-family:var(--f-display);font-weight:700;font-size:17px;color:var(--link)}

확정된 설정은 모순을 피하기 위한 바닥일 뿐 테두리가 아니다. 모순만 아니라면 확정되지 않은 부분은 적극적으로 새로 정한다.

- 확정된 대상에도 새로운 면을 더해도 된다(사건의 뒷이야기, 인물의 다른 시기, 조직의 지부). 이미 확정된 큰 사건도 마찬가지다. 그 사건의 확정된 날짜와 결과는 지키되, 이 항목이 그 안에서 무엇을 했는지는 새로 정해도 된다. 모순이 두려워 큰 사건을 비켜 가거나 배경 설명으로만 넘기지 않는다.

## 문장 기준
- 구체성은 의미 있는 디테일이다. 숫자는 그 숫자가 무엇을 뜻하는지 드러날 때만 쓰고, 예산 내역이나 인원수 나열로 분량을 채우지 않는다. "다양한", "중요한 역할을 했다", "큰 영향을 미쳤다", "많은 사람들이" 대신 고유명사와 일화를 쓴다. 어떤 디테일이 어울리는지는 분위기 지침을 따른다.
- 단정형으로 쓴다. "밝혀지지 않았다", "공개되지 않았다", "기밀이다", "기록에 남아 있지 않다", "공식 입장을 내지 않았다", "~라고 전해진다" 같은 얼버무림은 쓰지 않는다. 조직의 반응은 실제로 한 조치(발표, 징계, 해명, 소송)로 쓴다.
- "~의 근거가 되었다", "~의 계기가 되었다", "~의 시초가 되었다", "~의 토대가 되었다", "~의 상징이 되었다", "오늘날까지 이어지고 있다" 같은 연결 상투구는 문서 전체에서 많아야 한 번이다. 한 일이 다른 일로 이어졌다면 누가 언제 무엇을 했는지 장면으로 쓴다.
- 발언은 간접 인용으로 내용만 옮기는 것이 기본이다. 본문 중간에 큰따옴표 대사를 넣고 "~라고 말했다"로 받지 않는다. 직접 인용은 없는 것이 기본이다. 작중에서 실제로 회자되는 한마디가 있을 때만 문서 전체에서 1개까지 넣고, 그런 말이 없으면 넣지 않는다. 인용이 없는 문서도 좋은 문서다. 절정의 순간에 나온 말이나 작중에서 회자되는 한마디를 우선하며, 인물 문서라면 주인공 본인의 말을 우선한다. 인용할 때는 "> " 인용문 상자로 따로 두고 다음 줄에 "> — 화자, 출처"를 붙인다. 격언, 선언문, 예고편 대사처럼 다듬은 말은 쓰지 않는다. 그 상황에서 실제로 나올 법한 짧고 거친 말이며, 말을 더듬거나 흐리거나 엉뚱한 소리를 해도 된다. 화자의 말투와 상황이 드러나게 한다.
  - 나쁜 예(선언문): "침묵하는 다수는 무덤 아래에 있으며, 그들의 권리는 석판보다 단단하다."
  - 좋은 예(그 자리의 말): "다 끝났소? 그럼 창문 좀 닫으시오. 촛불이 저 꼴이니."
  좋은 예는 상황(냉기, 촛불)과 화자의 처지(지치고 겁먹음)가 말에 묻어 있고, 주제를 요약하지 않는다.
- 인물의 속마음, 생각, 느낌은 위키 작성자가 알 수 있는 방식으로만 쓴다. 본인의 증언, 편지, 기록, 남이 본 행동으로 드러내고, 소설처럼 머릿속을 서술하지 않는다.
- "A가 아니라 B였다", "A보다 B였다" 같은 반전 대구는 인용문, 개요, 본문 어디에서도 쓰지 않는다. 이 세계에 없는 현실의 고사나 관용구(아킬레스건, 루비콘 등)도 쓰지 않는다.
- 개요는 훅과 정의를 중심으로 짧게 쓴다. 진영별 이름, 규모 비교, 후대 평가 같은 정보를 개요에 몰아넣지 않고 맞는 섹션에 둔다.
- 근거 없는 칭찬은 하지 않되 강한 것은 강하다고 쓴다. 강함은 형용사가 아니라 비교 대상, 전과, 상대가 치른 대가로 보여 준다. 실패와 갈등은 흐름 속에서 쓰고, "~라는 비판이 있다. 반면 ~" 식의 양론 정리나 "해석이 엇갈린다", "논쟁이 이어지고 있다" 같은 문장은 쓰지 않는다.
- 풍습, 은어, 속설은 이 항목이 직접 원인이거나 핵심 소재일 때만 다루고, 새로 만드는 것은 문서당 많아야 하나다.
- 같은 정보를 반복하지 않는다. 인포박스의 수치와 날짜를 개요에서 다시 나열하지 않고, 개요에서 생애나 연혁을 요약하지 않는다.
- 작중 시점과 맞지 않는 연도를 쓰지 않는다. 학년, 기수, 계급, 직위, 나이, 재학·재직·복무 기간은 작중 기준 시점에서 거꾸로 계산해 모든 연도와 맞춘다. 예를 들어 기준 시점에 1학년(신입생)인 인물은 그 전 해들에는 아직 입학 전이므로 그 학교의 학생으로 활동할 수 없고, 기준 시점에 2학년인 선배는 1년 전에 1학년이다. 과거 사건에 등장시킬 때는 그때의 나이와 신분이 그 사건에 맞는지 확인한다.
- 나이, 기간, 금액, 인원처럼 계산이 걸린 수치는 문서 안의 다른 날짜와 수치로 다시 계산해 서로 맞춘다(예: 출생일과 사건 날짜로 그때의 나이를 계산한다). 부대나 기체의 수는 동원, 손실, 격파, 항복, 잔존을 합쳐 처음 숫자와 맞춘다. 비율은 10할(100%)을 넘지 않는다. 개요에서 한 단언(예: 한 발도 쏘지 않았다)은 본문의 사건과 어긋나지 않게 범위를 정확히 쓴다.

${showFor(ty, ["인물"]) ? `## 인물의 성격과 특징\n${TRAIT_RULE}\n\n${(() => { const ti = traitIndex(w, key); return ti ? `## 다른 인물의 특징 (표현 반복 참고)\n${ti}\n\n` : ""; })()}## 인물 문서
이 항목이 인물이면 이력서가 아니라 사람의 이야기로 쓴다. 동물, 기계, 신, 정령처럼 사람이 아닌 존재라면 아래 항목을 그 존재에 맞게 바꿔 적용하고, 맞지 않는 항목(예: 소의 혼인)은 언급하지 않는다.
- 인물의 성격: 역할, 경험, 관계 속에서 어떤 선택을 하고 어떻게 행동하는지로 보여 준다. 평범하고 선량한 사람도 좋은 인물이다. 강렬한 성격이나 극단적인 결함은 그 인물의 맥락에 맞을 때만 쓰고, 개성을 만들려고 억지로 덧붙이지 않는다.
- 사적인 면은 인물의 삶과 관계에 자연스럽게 연결될 때 다룬다. 특징 수를 채우려고 취미, 약점, 버릇을 억지로 만들지 않는다.
- '특징' 섹션: 이 인물을 이해하는 데 필요한 특징 2~3개를 구체적인 소제목으로 쓰고, 각 특징은 "~한 성격이다"라고 단정하는 대신 일화로 보여 준다. 다른 인물과 성격이 비슷해도 이 인물이 겪은 사건과 관계에 맞게 쓴다. 특징은 기벽이나 집착이 아니어도 된다.
- 강함과 이름: 강함이나 무서움은 적과 맞수가 그를 어떻게 대했는지로 전하고, 이명이 있다면 누가 왜 붙였는지 쓴다.
- 동기의 뿌리: 이 인물이 무엇을 바라는지가 어디서 시작되었고 어떻게 바뀌었는지를 생애 안에서 보여 준다. 바라는 것은 가족의 안녕, 생계, 인정받기, 평온한 노후처럼 소박해도 된다.
- 생애의 하위 섹션은 직책이 아니라 전환점(사건, 결정, 상실, 만남)을 제목으로 삼는다. 각 전환점에서 무엇을 원했고, 어떤 선택지가 있었고, 왜 그쪽을 택했고, 무엇을 잃었는지를 쓴다. 동기는 본인이 남긴 말이나 편지, 주변의 증언, 행동으로 드러낸다.
- 직책과 연도의 나열은 인포박스로 보낸다.
- '인물' 섹션의 중심은 사적인 삶이다. 가족, 배우자, 연인, 친구는 이미 확정된 관계(위의 확정 설정과 인물 관계)를 쓴다. 정해지지 않은 가족이나 연인을 새로 지어내 채우지 않고, 짧게 적거나 비워 둔다. 연인이나 옛 연인은 이 인물의 이야기에 꼭 필요할 때만 쓴다. 사적인 관계가 공적인 선택에 준 영향이 있으면 쓴다. 습관, 버릇, 아끼던 물건 같은 생활 디테일은 한두 가지까지 쓰되, 이 인물의 처지(직업, 과거)에서 나온 이유가 보이는 것을 고른다. 생활 디테일을 기벽이나 강박으로 만들지 않는다.
- '인물 관계' 섹션에서는 확정된 관계와 이 문서에 실제로 나온 인물과의 관계를 다룬다. 관계를 채우려고 새 인물을 만들지 않는다. 관계가 어떻게 시작해 어떻게 변했는지 쓰고, 위의 '확정된 인물 관계'와 일치시킨다.
- 실패, 후회, 풀리지 않은 갈등도 쓴다.

` : ""}## 작성 규칙
- 문체: ${st.desc}

- 하이퍼링크: 다른 항목은 [[제목]] 또는 [[제목|본문에 보일 말]]로 감싼다. 링크는 공격적으로 건다. 본문과 인포박스에 나오는 단어 중 따로 문서가 될 만한 것은 처음 나올 때 모두 링크한다. 이름 있는 인물, 장소, 조직, 사건, 문서나 기록, 물건, 제도, 그리고 이 세계에만 있는 용어(예: 어떤 존재들의 방언, 고유한 직업이나 의식)가 여기에 해당한다. 본문에 이름이 나온 인물, 조직, 장소, 사건은 처음 나올 때 빠짐없이 링크하며, 이 규칙은 아래 개수 목표보다 우선한다. 그 밖의 용어까지 합친 목표는 문서당 12~18개이고, 꼭 눌러 보고 싶은 것부터 건다. 이미 있는 항목도 본문에 자연스럽게 나왔다면 위 목록의 제목을 글자 그대로 써서 링크한다. 이미 있는 인물을 성이나 이름, 별명만으로 부를 때도 링크는 [[목록의 전체 제목|부른 이름]]으로 건다(예: [[마커스 벡|벡]]). 같은 대상을 다른 이름으로 링크해 새 항목을 만들지 않는다. 다만 링크하려고 기존 항목을 "~의 사례로 꼽힌다", "~와도 관련이 있다"처럼 억지로 끌어오지는 않는다. 현실의 일반 명사(소, 정오, 철도)는 이 세계에서 특별한 의미가 없으면 링크하지 않는다. 자기 자신은 링크하지 않고, 같은 대상은 처음 한 번만 링크한다.
- 인포박스: 유형에 맞는 4~8개 항목(label/value). value에도 [[링크]]를 쓸 수 있다. 인물이면 '성별' 줄을 반드시 넣는다(남성 또는 여성. 그 인물이나 세계 설정상 의미가 있을 때만 논바이너리나 그 세계의 표현을 쓰고, 사람이 아닌 존재는 '해당 없음'이나 그 존재에 맞는 말을 쓴다). 본문의 대명사와 서술도 이 성별과 맞춘다. 인물이면 해당하는 경우 배우자, 자녀 같은 가족 항목을 넣는다. 전투나 전쟁이면 기간, 장소, 교전 세력, 지휘관(전사한 사람은 이름 뒤에 †), 전력, 피해, 결과를 넣고, 양측이 있는 항목은 value 안에서 "진영 A: … / 진영 B: …"로 나란히 쓴다.
- 틀(navboxes): 이 항목 자체가 구성원이 정해진 집단(부대, 팀, 중대, 위원회, 내각, 기사단, 밴드, 가문, 왕조, 기수, 함대, 특정 기체 계열 등)이면 구성원 명단을 틀로 만든다.
  - 구성원이 40명 이하면 한 명도 빼지 않고 전원을 쓴다. 그보다 많으면 지휘부와 주요 구성원, 하위 단위를 정리한다.
  - 모든 구성원에게 고유한 이름을 붙이고 [[링크]]한다. 각 항목은 "[[이름]] — 짧은 설명" 형식이며, 설명에는 번호, 역할, 현재 상태(전사, 실종, 퇴역, 교체 등) 중 해당하는 것을 쓴다.
  - 행(rows)은 기수, 시기, 소속, 역할 등 이 집단에 맞는 기준으로 나눈다. 교체되거나 떠난 구성원도 포함한다.
  - 본문과 인포박스가 말하는 인원수, 번호, 결원과 보충 내역이 틀과 정확히 일치해야 한다. 이미 확정된 구성원 정보(위의 확정 사실과 언급)와도 일치시킨다.

const namesOf = t => { const m = String(t).match(/^(.+?)\((.+)\)$/); return [t, ...(m ? [m[1].trim(), m[2].trim()] : [])].filter(x => x.length >= 2); };
function checkBrief(w, k, key) {

/* 문서 안에서 두 곳 이상에 나오는 대상(항목 이름, 연도)과 그 위치. 검사 모델이 무엇을 맞춰 볼지 고르지 않아도 되게 앱이 먼저 짚어 준다 */
function crossRefs(w, p) {
  const parts = [];
  if (p.summary) parts.push({ name: "한 줄 정의", text: p.summary });
  if (p.categories?.length) parts.push({ name: "분류", text: p.categories.join(" | ") });
  if (p.infobox?.length) parts.push({ name: "인포박스", text: p.infobox.map(r => `${r.label}: ${stripMarks(r.value)}`).join("\n") });
  for (const s of p.sections) parts.push({ name: s.heading, text: s.heading + "\n" + stripMarks(s.body) });
  const subj = new Map();   // 표시 이름 → 검색어들
  for (const [k, o] of Object.entries(w.entities)) {
    if (k === p.key) continue;
    const names = new Set(namesOf(o.title));
    if (o.type === "인물") for (const t of o.title.replace(/\(.*\)$/, "").split(/[\s·]+/)) if (t.length >= 2) names.add(t);   // 성이나 이름만 쓴 경우
    subj.set(o.title, [...names]);
  }
  const years = new Set(); for (const x of parts) for (const m of x.text.matchAll(/(^|\D)(1\d{3}|20\d{2})년/g)) years.add(m[2] + "년");   // 뒤돌아보기 정규식은 오래된 Safari가 못 읽어 쓰지 않는다
  for (const y of years) subj.set(y, [y]);
  const out = [];
  for (const [label, names] of subj) {
    const where = parts.filter(x => names.some(n => x.text.includes(n))).map(x => x.name);
    if (where.length >= 2) out.push({ label, where });
  }
  out.sort((a, b) => b.where.length - a.where.length);
  return out.slice(0, 30).map(x => `- ${x.label}: ${x.where.map(n => `「${n}」`).join(", ")}`).join("\n");

      timeline: [], userCanon: "", entities: {}, mainKey: null, createdAt: Date.now() };

/* 스토리 모드 세계관 준비: 주인공(=첫 문서), 숨겨진 뼈대, 1장 */
function setupStory(w, b, user = {}) {
  const pr = b.protagonist && typeof b.protagonist === "object" ? b.protagonist : {};
  const sp = Array.isArray(b.spine) ? b.spine : [];
  const total = Math.min(STORY_MAX, Math.max(STORY_MIN, +user.total || STORY_DEF));
  const spine = beatsFor(total).map((beat, i) => { const x = sp.find(y => +y?.n === i + 1) || sp[i] || {}; return { n: i + 1, beat, intent: stripMarks(x.intent || "").slice(0, 300) || `${beat}: 주인공의 바람과 상처를 건드리는 사건`, revised: false }; });
  const c1 = b.chapter1, era = norm(c1.era || b.era || w.era).slice(0, 40) || w.era;
  const e = w.entities[w.mainKey]; e.type = "인물"; e.summary = stripMarks(pr.summary || "").slice(0, 200);
  w.mode = "story"; w.era = era;
  w.story = { protagonistKey: w.mainKey, chapter: 1, total, status: "active", spine, endedAt: null, epilogue: "",
    protagonist: { summary: e.summary, want: stripMarks(pr.want || "").slice(0, 200), wound: stripMarks(pr.wound || "").slice(0, 200) },
    chapters: [{ n: 1, title: chTitle(c1.title || "발단").slice(0, 60), era, summary: stripMarks(c1.summary).slice(0, 800), incident: stripMarks(c1.incident || "").slice(0, 240),
      startedAt: Date.now(), explore: emptyExplore(), choice: null, wove: [], affected: [], auto: [],
      nextChoices: (Array.isArray(c1.nextChoices) ? c1.nextChoices : []).map(x => stripMarks(asText(x)).slice(0, 200)).filter(Boolean).slice(0, 3) }] };
  // 사용자가 정한 주인공 특징과 등장인물은 '사용자 확정' 설정으로 남긴다
  if (user.desc) { w.story.protagonist.desc = user.desc; addFact(e, "주인공의 특징(사용자 지정): " + user.desc, "user"); }
  const N = w.story.total;
  w.story.secrets = (Array.isArray(b.secrets) ? b.secrets : []).filter(x => x && x.truth).slice(0, 5).map((x, i) => ({ id: "s" + (i + 1),
    truth: stripMarks(asText(x.truth)).slice(0, 300), cover: stripMarks(asText(x.cover || "")).slice(0, 300) || "알려진 것이 없다",
    reveal: Math.min(N, Math.max(2, parseInt(x.reveal, 10) || N)), revealed: false }));
  w.story.cast = [];
  for (const c of user.cast || []) {
    const k = keyOf(c.name); if (k === w.mainKey) continue;
    if (!w.entities[k]) w.entities[k] = newEntity(c.name, "인물", c.desc.slice(0, 200));
    const o = w.entities[k]; o.type = "인물"; o.origin = w.mainKey;
    if (c.desc) addFact(o, c.desc, "user");
    if (c.rel) { addFact(o, `「${e.title}」과(와)의 관계: ${c.rel}`, "user"); addRelation(w, "user", { a: e.title, b: c.name, rel: c.rel.slice(0, 60), story: c.rel.length > 60 ? c.rel : "" }); }
    w.story.cast.push({ key: k, name: c.name, desc: c.desc, rel: c.rel });
  }
}

/* 항목 합치기: pairs = [[없앨 항목 키, 남길 항목 키], ...]
   남길 항목에 문서가 없으면 없앨 항목의 문서를 옮기고, 둘 다 문서가 있으면 없앨 항목의 문서와 그 문서가 남긴 설정을 지운다.
   없앤 이름은 w.aliases에 남겨, 이후 그 이름으로 건 링크가 남길 항목으로 넘어가게 한다(넘겨주기). */
async function mergeEntities(w, pairs) {
  const map = Object.fromEntries(pairs), re = k => { let n = 0; while (map[k] && n++ < 20) k = map[k]; return k; };
  const removed = [], saved = new Set();
  w.aliases ||= {};
  for (const [dk] of pairs) {
    const bk = re(dk), d = w.entities[dk], b = w.entities[bk], dp = S.pages[dk];
    if (!d || !b || dk === bk) continue;
    if (dp && !S.pages[bk]) {
      dp.key = bk; dp.title = b.title; S.pages[bk] = dp; saved.add(bk);
      b.type = d.type || b.type; b.summary = d.summary || b.summary; b.box = d.box || b.box; b.page = true; if (d.stub && !b.stub) b.stub = d.stub;
    } else if (dp) {
      if (!S.pages[bk].portrait && dp.portrait) { S.pages[bk].portrait = dp.portrait; saved.add(bk); }
      purge(w, dk);
      for (const [id, nb] of Object.entries(w.navboxes || {})) if (nb.src === dk) delete w.navboxes[id];
    }
    if (dp) { delete S.pages[dk]; removed.push(dk); }
    for (const f of d.facts) if (!b.facts.some(x => x.t === f.t)) b.facts.push(f);
    for (const x of d.mentions) if (!b.mentions.some(y => y.from === x.from && y.text === x.text)) b.mentions.push(x);
    if (b.facts.length > 24) b.facts.splice(0, b.facts.length - 24);
    delete w.entities[dk];
    w.aliases[dk] = bk;
  }
  for (const [x, y] of Object.entries(w.aliases)) { w.aliases[x] = re(y); if (w.entities[x]) delete w.aliases[x]; }
  for (const [k, o] of Object.entries(w.entities)) {
    for (const f of o.facts) f.src = re(f.src);
    o.mentions = o.mentions.filter(x => { x.from = re(x.from); return x.from !== k; });
    for (const x of [...o.facts, ...o.mentions]) if (x.sup) x.sup.by = re(x.sup.by);
    if (o.origin) o.origin = re(o.origin);
  }
  w.relations = (w.relations || []).filter(x => { x.a = re(x.a); x.b = re(x.b); x.src = re(x.src); if (x.sup) x.sup.by = re(x.sup.by); return x.a !== x.b; });
  for (const t of w.timeline) { t.src = re(t.src); if (t.sup) t.sup.by = re(t.sup.by); }
  for (const nb of Object.values(w.navboxes || {})) {
    nb.src = re(nb.src); nb.members = [...new Set((nb.members || []).map(re))];
    for (const r of nb.rows) r.items = r.items.map(x => cleanLinks(w, x));
  }
  if (w.mainKey) w.mainKey = re(w.mainKey);
  if (isStory(w)) {
    const st = w.story; st.protagonistKey = re(st.protagonistKey);
    const uniq = a => [...new Set((a || []).map(re))];
    for (const c of st.chapters) {
      c.auto = uniq(c.auto);
      const seen = new Set(); c.affected = (c.affected || []).filter(a => { a.key = re(a.key); return !seen.has(a.key) && seen.add(a.key); });
      const seen2 = new Set(); c.wove = (c.wove || []).filter(a => { a.key = re(a.key); return !seen2.has(a.key) && seen2.add(a.key); });
      const x = c.explore; if (x) { const op = {}; for (const [k, n] of Object.entries(x.opened || {})) op[re(k)] = (op[re(k)] || 0) + n; x.opened = op; x.created = uniq(x.created); x.edited = uniq(x.edited); x.searched = uniq(x.searched); }
    }
  }
  for (const [k, p] of Object.entries(S.pages)) {
    const before = JSON.stringify([p.sections, p.infobox, p.notices, p.links, p.conflicts]);
    for (const sec of p.sections) sec.body = cleanLinks(w, sec.body);
    for (const r of p.infobox || []) r.value = cleanLinks(w, r.value);
    p.notices = (p.notices || []).map(x => cleanLinks(w, x));
    p.links = [...new Set((p.links || []).map(re))].filter(x => x !== k);
    for (const c of p.conflicts || []) c.by = re(c.by);
    if (JSON.stringify([p.sections, p.infobox, p.notices, p.links, p.conflicts]) !== before) saved.add(k);
  }
  S.recent = [...new Set(S.recent.map(re))].filter(x => w.entities[x]);
  try {
    for (const k of removed) await Store.deletePage(w.id, k);
    for (const k of saved) if (S.pages[k]) await Store.savePage(w.id, S.pages[k]);
    await Store.saveWorld(w);
  } catch (err) { toast("항목을 합쳤지만 저장하지 못했습니다. " + errMsg(err)); }
  return re;
}
/* 세계관을 열 때 자동으로 합치는 것: "이름(인물)"처럼 유형이 붙은 항목, 그리고 문서가 없는 "벡"처럼 한 인물의 성이나 이름만 쓴 항목 */
async function autoMerge(w) {
  const pairs = [], protect = new Set([w.mainKey, ...(isStory(w) ? [w.story.protagonistKey, ...(w.story.cast || []).map(c => c.key)] : [])]);   // 사용자가 정한 인물은 자동으로 합치지 않는다
  for (const [dk, d] of Object.entries(w.entities)) {
    if (protect.has(dk)) continue;
    const m = TYPE_SUFFIX.exec(d.title || "");
    if (m) { const bk = keyOf(norm(m[1])); if (bk !== dk && w.entities[bk]) { pairs.push([dk, bk]); continue; } }
    if (!S.pages[dk] && (!d.type || d.type === "인물")) { const bk = nameOwner(w, d.title, dk); if (bk) pairs.push([dk, bk]); }
  }
  if (!pairs.length) return 0;
  await mergeEntities(w, pairs);
  return pairs.length;
}

/* 예전 버전에서 AI 수정이 다른 문서를 대체하고 경고를 붙인 흔적을 걷어낸다.
   대체 표시(sup)와 경고는 사용자가 직접 수정한 문서만 세울 수 있으므로, 직접 수정한 적 없는 문서가 세운 것은 지운다 */
async function cleanAiSupersede(w) {
  const userEdited = k => !!S.pages[k]?.editedAt, saved = new Set(); let ws = false;
  const un = x => { if (x?.sup && !userEdited(x.sup.by)) { delete x.sup; ws = true; } };
  for (const o of Object.values(w.entities)) { o.facts.forEach(un); o.mentions.forEach(un); }
  (w.timeline || []).forEach(un); (w.relations || []).forEach(un);
  for (const [k, P] of Object.entries(S.pages)) {
    const n = (P.conflicts || []).length; if (!n) continue;
    P.conflicts = P.conflicts.filter(c => userEdited(c.by)); if (P.conflicts.length !== n) saved.add(k);
  }
  try { for (const k of saved) await Store.savePage(w.id, S.pages[k]); if (ws) await Store.saveWorld(w); } catch {}
  return saved.size;
}
/* 이미 저장된 장 제목과 장 섹션 제목에서 장 번호를 뗀다 */
async function cleanChapterTitles(w) {
  if (!isStory(w)) { if ((w.rules || []).some(isBroken)) { w.rules = w.rules.filter(x => !isBroken(x)); try { await Store.saveWorld(w); } catch {} } return; }
  let ws = false; const pg = [];
  for (const c of w.story.chapters) {
    const t = chTitle(c.title); if (t !== c.title) { c.title = t; ws = true; }
    if ((c.nextChoices || []).some(isBroken)) { c.nextChoices = c.nextChoices.filter(x => !isBroken(x)); ws = true; }   // 예전 버전에서 깨져 저장된 선택지
  }
  if ((w.rules || []).some(isBroken)) { w.rules = w.rules.filter(x => !isBroken(x)); ws = true; }
  for (const [k, p] of Object.entries(S.pages)) {
    let ch = false;
    for (const sec of p.sections) if (sec.ch) { const h = stripHead(sec.heading); if (h && h !== sec.heading) { sec.heading = h; ch = true; } }
    if (ch) pg.push(k);
  }
  try { for (const k of pg) await Store.savePage(w.id, S.pages[k]); if (ws) await Store.saveWorld(w); } catch {}
}
/* 사용자가 고른 합치기: dk 항목을 bk 항목에 합친다 */
async function mergeAction(dk, bk) {
  const w = S.world; if (!w || !w.entities[dk] || !w.entities[bk] || dk === bk) return;

}
async function notSame(k, other) {

/* 다시 만들기: 처음 입력값을 세계관 만들기 화면에 채워 연다 */
function openRegen() {
  const w = S.world; if (!w) return;
  if (S.gen?.wid === w.id || S.storyGen || S.syncing) { toast("작성 중인 문서가 끝난 뒤 다시 만들어 주세요."); return; }
  const story = isStory(w), inp = w.input || {};
  S.regen = { wid: w.id, title: w.title, keep: false };
  S.mode = story ? "story" : "basic";
  S.seed = S.ownSeed = w.seed || ""; S.seedTab = "own"; S.dice = null; S.whatIfs = null;
  S.guideIn = w.guide || "";
  S.first = inp.first ?? (story ? w.entities[w.story.protagonistKey]?.title || "" : "");
  S.protoDesc = story ? (inp.protoDesc ?? w.story.protagonist?.desc ?? "") : "";
  if (story) S.storyN = totalOf(w);
  S.cast = story ? (inp.cast || (w.story.cast || []).map(c => ({ name: w.entities[c.key]?.title || c.name, desc: c.desc || "", rel: c.rel || "" }))).map(c => ({ ...c })) : [];
  S.createErr = null;

}
function cancelRegen() {

}

async function openWorld(wid, goKey) {

  if (S.gen && S.gen.wid !== wid) { toast("다른 세계관의 문서를 작성하는 중입니다. 끝난 뒤 열어 주세요."); return; }

  S.view = { name: "loading" }; renderAll();

  if (merged) toast(`같은 대상을 가리키는데 따로 생긴 항목 ${merged}개를 원래 항목에 합쳤습니다. 예: "이름(인물)", 성이나 이름만 쓴 인물.`);
}

function openEntity(k) {
  const w = S.world; if (!w || !w.entities[k]) return;

async function generatePage(k, rewrite, direction) {

    }

    if (out && out.notFound === true && e.src === "search") {

      else { renderSide(); toast(`‘${nf}’ 문서를 찾을 수 없습니다.`); }

    }

/* 본문에 이름만 나오고 링크가 빠진 기존 항목을 첫 등장 위치에서 링크한다 (생성 직후, 조용히) */
function autoLink(w, key, out) {
  if (!Array.isArray(out?.sections)) return 0;
  const linked = new Set();
  for (const t of [...out.sections.map(s => String(s?.body || "")), ...(Array.isArray(out.infobox) ? out.infobox : []).map(r => String(r?.value || ""))])
    for (const m of t.matchAll(LINK_RE)) linked.add(kOf(w, m[1]));
  const cands = [];
  for (const [k, o] of Object.entries(w.entities)) {
    if (k === key || linked.has(k)) continue;
    for (const n of namesOf(o.title)) if (!/^[㐀-鿿]+$/.test(n)) cands.push({ k, n, title: o.title });
  }
  cands.sort((a, b) => b.n.length - a.n.length || (b.n === b.title) - (a.n === a.title));
  const inLink = (t, i) => t.lastIndexOf("[[", i) > t.lastIndexOf("]]", i);
  let added = 0;
  for (const c of cands) {
    if (linked.has(c.k) || added >= 12) continue;
    for (const sec of out.sections) {
      if (!sec || typeof sec.body !== "string") continue;
      let i = sec.body.indexOf(c.n);
      while (i >= 0 && (inLink(sec.body, i) || /[가-힣A-Za-z0-9]/.test(sec.body[i - 1] || ""))) i = sec.body.indexOf(c.n, i + 1);
      if (i < 0) continue;
      const tag = c.n === c.title ? `[[${c.title}]]` : `[[${c.title}|${c.n}]]`;
      sec.body = sec.body.slice(0, i) + tag + sec.body.slice(i + c.n.length);
      linked.add(c.k); added++; break;
    }
  }
  return added;
}

function readConflicts(w, raw, refs) {
  const out = [], seen = new Set();
  for (const c of (Array.isArray(raw) ? raw : [])) {
    if (!c || !c.ref) continue;
    const id = String(c.ref).trim().toUpperCase(), ref = refs[id];
    if (!ref || seen.has(id)) continue; seen.add(id);
    const x = { id, kind: ref.kind, claim: stripMarks(c.claim).slice(0, 300), old: stripMarks(c.old).slice(0, 300) };
    if (ref.kind === "rule") Object.assign(x, { i: ref.i, old: x.old || w.rules[ref.i], suggest: stripMarks(c.suggest).slice(0, 300) || w.rules[ref.i] });
    if (ref.kind === "canon") x.old = x.old || "사용자 확정 설정";
    if (ref.kind === "fact") Object.assign(x, { f: ref.f, src: ref.f.src, old: x.old || ref.f.t });
    if (ref.kind === "mention") Object.assign(x, { m: ref.m, src: ref.m.from, old: x.old || ref.m.text });
    if (ref.kind === "timeline") Object.assign(x, { t: ref.t, src: ref.t.src, old: x.old || `${ref.t.year}: ${ref.t.event}` });
    if (ref.kind === "relation") Object.assign(x, { l: ref.l, src: ref.l.src, old: x.old || relLine(w, ref.l) });
    // 사용자 자신이 정한 것(핵심 규칙, 확정 설정, 직접 수정한 문서)과의 충돌은 사용자에게 묻는다
    x.ask = ref.kind === "rule" || ref.kind === "canon" || !!(x.src && S.pages[x.src]?.editedAt);
    out.push(x);

async function preparePortrait(file) {

    for (let i = 0; i < 6; i++, scale *= .75) {

function inline(raw) {   // 링크를 자리표로 바꿔 두고 서식을 입히므로, 굵게·취소선 안의 링크도 제대로 보인다
  const links = [];
  const out = fmt(raw.replace(LINK_RE, (m, a, b) => "\u0003" + (links.push(linkHtml(a, b)) - 1) + "\u0004")).replace(/\u0003(\d+)\u0004/g, (m, n) => links[n]);
  return out.replace(/\u0001(\d+)\u0002/g, (m, n) => `<sup class="fn"><a href="#fn-${n}" id="fnr-${n}" data-fn="${n}">[${n}]</a></sup>`);
}
const fmt = s => esc(s).replace(/\*\*([^*]+)\*\*/g, "<strong>$1</strong>").replace(/~~([^~]+)~~/g, "<del>$1</del>");
function extractFootnotes(src, fns) {
  let text = "", i = 0;
  while (i < src.length) {
    if (src[i] === "[" && src[i + 1] === "*") { let d = 1, j = i + 2; while (j < src.length && d > 0) { if (src[j] === "[") d++; else if (src[j] === "]") d--; j++; } if (d === 0) { fns.push(src.slice(i + 2, j - 1).trim()); text += "\u0001" + fns.length + "\u0002"; i = j; continue; } }
    text += src[i]; i++;
  }
  return text;
}
function blocks(body, fns) {
  const text = extractFootnotes(String(body), fns);
  let html = "";
  for (const blk of text.split(/\n{2,}/)) {
    const lines = blk.split("\n").map(l => l.replace(/\s+$/, "")).filter(l => l.trim());
    let para = [], list = [], quote = [];
    const flushP = () => { if (para.length) { html += `<p>${para.map(inline).join("<br>")}</p>`; para = []; } };
    const flushQ = () => {
      if (!quote.length) return;
      let by = "";
      if (quote.length > 1 && /^[—―–-]{1,2}\s*/.test(quote[quote.length - 1])) by = quote.pop().replace(/^[—―–-]{1,2}\s*/, "");
      html += `<blockquote><div>${quote.map(inline).join("<br>")}</div>${by ? `<cite>${inline(by)}</cite>` : ""}</blockquote>`; quote = [];
    };
    const flushL = () => {
      if (!list.length) return;
      html += `<ul>${list.map(it => `<li>${inline(it.t)}${it.kids.length ? `<ul>${it.kids.map(k => `<li>${inline(k)}</li>`).join("")}</ul>` : ""}</li>`).join("")}</ul>`;
      list = [];
    };
    for (const l of lines) {
      const lm = l.match(/^(\s*)(?:[-*•]|--)\s+(.*)$/);
      if (lm) {
        flushP(); flushQ();
        const sub = lm[1].replace(/\t/g, "  ").length >= 2 || /^\s*--\s/.test(l);
        if (sub && list.length) list[list.length - 1].kids.push(lm[2]); else list.push({ t: lm[2], kids: [] });
      }
      else if (/^\s*>\s?/.test(l)) { flushP(); flushL(); quote.push(l.replace(/^\s*>\s?/, "")); }
      else if (/^#{2,4}\s+/.test(l)) { flushP(); flushL(); flushQ(); html += `<h3>${inline(l.replace(/^#+\s+/, ""))}</h3>`; }
      else { flushL(); flushQ(); para.push(l.trim()); }
    }
    flushP(); flushL(); flushQ();
  }
  return html;
}

        <div class="row" style="margin-top:2px"><button type="button" class="btn" data-act="roll" ${S.creating ? "disabled" : ""}>다시 굴리기</button><span class="note">고정한 칸은 그대로 두고 나머지만 바꿉니다. 칸을 눌러 직접 고쳐 쓸 수 있고, 고쳐 쓴 칸은 고정됩니다. 아래 원안을 고쳐 써도 됩니다.</span></div></div>` : ""}

        <div class="wi-grid">${S.whatIfs.map(q => `<button type="button" class="wi" data-whatif="${esc(q)}" ${S.creating || !S.sample ? "disabled" : ""}><span>만약</span>${esc(q)}</button>`).join("")}</div>

      <textarea id="seedTa" rows="7" ${S.creating ? "disabled" : ""} ${S.seedTab === "whatif" ? "hidden" : ""} placeholder="어떤 세계인지 몇 문장으로 적어 주세요. 무엇이 현실과 다른지, 언제 어디가 무대인지, 누가 무엇을 두고 다투는지가 있으면 좋습니다.&#10;&#10;예: 우주력 1388년, 위화도에서 회군한 기동갑주가 왕조를 갈아치웠고, 그 왕조가 500년을 버텨 온 콜로니 국가.">${esc(S.seed)}</textarea>
      ${/^\d+$/.test(S.seedTab) ? `<p class="note" style="margin:6px 0 0">예시 원안입니다. 고쳐 쓰면 직접 작성 탭으로 옮겨집니다.</p>` : ""}
      ${S.mode === "story" ? `<label class="lb" for="firstIn">주인공 <span class="note" style="font-weight:400">선택 · 비워 두면 원안에 맞는 인물로 자동 선택</span></label>
      <input id="firstIn" class="txt" type="text" maxlength="60" value="${esc(S.first)}" placeholder="예: 이순신, 한서린" ${S.creating ? "disabled" : ""}>
      <label class="lb" for="protoDesc">주인공 특징 <span class="note" style="font-weight:400">선택 · 성격, 능력, 처지, 바라는 것 등. 반드시 지킬 설정이 됩니다</span></label>
      <textarea id="protoDesc" rows="2" maxlength="500" placeholder="예: 몰락한 무관 가문의 막내. 활은 잘 쏘지만 겁이 많다. 아버지의 누명을 벗기고 싶어 한다." ${S.creating ? "disabled" : ""}>${esc(S.protoDesc)}</textarea>
      <label class="lb">등장인물 <span class="note" style="font-weight:400">선택 · 꼭 나왔으면 하는 인물. 최대 8명</span></label>
      ${S.cast.length ? `<div class="cast">${S.cast.map((c, i) => `<div class="cast-row">
        <input class="txt" data-cast="${i}" data-cf="name" maxlength="40" value="${esc(c.name)}" placeholder="이름" aria-label="등장인물 ${i + 1} 이름" ${S.creating ? "disabled" : ""}>
        <input class="txt cast-rel" data-cast="${i}" data-cf="rel" maxlength="120" value="${esc(c.rel)}" placeholder="주인공과의 관계 (예: 소꿉친구이자 맞수)" aria-label="등장인물 ${i + 1} 주인공과의 관계" ${S.creating ? "disabled" : ""}>
        <button type="button" class="btn" data-cast-del="${i}" aria-label="등장인물 ${i + 1} 빼기" ${S.creating ? "disabled" : ""}>빼기</button>
        <textarea rows="2" data-cast="${i}" data-cf="desc" maxlength="300" placeholder="특징 (예: 북관 출신 궁수. 말수가 적고 셈이 빠르다)" aria-label="등장인물 ${i + 1} 특징" ${S.creating ? "disabled" : ""}>${esc(c.desc)}</textarea></div>`).join("")}</div>` : ""}

      <input id="firstIn" class="txt" type="text" maxlength="60" value="${esc(S.first)}" placeholder="예: 위화도 회군, 태조 전용기, 한양 궤도 거주구" ${S.creating ? "disabled" : ""}>`}
      <label class="lb" for="guideIn">작가 지침 <span class="note" style="font-weight:400">선택 · 세계관 전체에 걸쳐 지킬 방향. 모든 문서에 함께 전달됩니다</span></label>
      <textarea id="guideIn" rows="3" maxlength="1000" placeholder="예: 일본 거대 로봇 메카닉 SF풍으로. 네임드 파일럿에게는 전용기를 준다. 양산기 바리에이션을 풍부하게. 잔혹한 묘사는 피한다." ${S.creating ? "disabled" : ""}>${esc(S.guideIn)}</textarea>

        ${!S.sampleReady ? `<span class="note">생성 기능을 준비하는 중…</span>` : (!S.sample ? `<span class="note">${esc(ERR.no_sample)}</span>` : "")}
      </div>
      ${S.createErr ? `<div class="banner warn">${esc(S.createErr)}</div>` : ""}
      <ol class="how">
        <li><span>1</span>원안에서 핵심 규칙, 연표, 작중 기준 시점을 뽑아 설정 노트를 만듭니다.</li>
        <li><span>2</span>문서를 쓸 때 링크한 항목마다 한 줄 정의와 언급 문장을 미리 기록합니다.</li>

    <section><h2 style="font-family:var(--f-display);font-size:18px;margin:4px 0 12px">내 세계관</h2><div class="wlist">${list}</div></section>

function articleHtml(k) {
  const w = S.world, e = w.entities[k], p = shownPage(k), held = isHeld(k);
  if (!e) return `<div class="sheet"><p>문서를 찾을 수 없습니다.</p></div>`;

  if (S.gen && S.gen.key === k) {
    return `<div class="sheet">${crumb}<h1 class="t">${esc(e.title)}</h1>
      <div class="gen-live"><span class="dot"></span><span id="genCount">${S.gen.phase === "check" ? "설정과 맞춰 보는 중" : S.gen.phase === "fix" ? `설정과 어긋난 ${S.gen.nFix}곳을 고치는 중` : "문서를 작성하는 중"}</span><button type="button" class="btn" data-act="stop">${S.gen.phase ? "검사 건너뛰고 보기" : "작성 중단"}</button></div>
      ${S.gen.direction ? `<p class="src" style="margin:10px 0 0">${S.gen.rewrite ? "다시 쓰기" : "작성"} 방향: ${esc(S.gen.direction)}</p>` : ""}
      ${promiseHtml(w, e, "이 문서가 지켜야 할 확정 내용")}
      <ul class="heads" id="genHeads"></ul>
      <div style="margin-top:14px"><div class="sk"></div><div class="sk"></div><div class="sk"></div><div class="sk"></div></div></div>`;
  }
  if (!p) {
    const er = S.genErr && S.genErr.key === k ? S.genErr : null;
    return `<div class="sheet">${crumb}<h1 class="t">${esc(e.title)}</h1>
      ${er ? `<div class="banner warn">${esc(er.msg)}</div>` : `<p class="note">아직 작성되지 않은 문서입니다.</p>`}
      ${promiseHtml(w, e, "이미 확정된 내용")}
      <div class="tools"><button type="button" class="btn pri" data-gen="${k}" ${S.gen || !S.sample ? "disabled" : ""}>이 문서 작성하기</button><button type="button" class="btn" data-compose="${k}">방향을 정해 작성</button></div></div>`;
  }
  const fns = [];
  const box = p.infobox?.length || p.type === "인물" ? `<aside class="infobox"><div class="ih">${esc(p.title)}</div>${portraitHtml(p)}<div class="ity">${esc(p.type)}</div><table>${(p.infobox || []).map((r, i) => `<tr><th>${esc(r.label)}</th><td class="secb" data-ib="${i}">${blocks(r.value, fns).replace(/^<p>|<\/p>$/g, "")}</td></tr>`).join("")}</table></aside>` : "";
  let n1 = 0, n2 = 0;
  const nums = p.sections.map(s => { if ((s.level || 1) === 2 && n1) { n2++; return `${n1}.${n2}.`; } n1++; n2 = 0; return `${n1}.`; });
  const story = isStory(w), pk = story ? w.story.protagonistKey : null, card = story && k === pk && !held && S.storyCard?.wid === w.id ? S.storyCard : null;
  const chb = (s, sub) => s.ch && !sub ? `<span class="chb">${s.ch}장</span>` : "";
  const secs = p.sections.map((s, i) => { const sub = nums[i].split(".").length > 2; return `<${sub ? "h3" : "h2"} id="s-${i}" class="${sub ? "sh" : ""}${!sub && card && s.ch === card.n ? " chnew" : ""}"><span class="n">${nums[i]}</span>${chb(s, sub)}${esc(s.heading)}</${sub ? "h3" : "h2"}><div class="secb" data-bi="${i}">${blocks(s.body, fns)}</div>`; }).join("");
  const toc = p.sections.length > 2 ? `<nav class="toc" aria-label="목차"><b>목차</b><ul>${p.sections.map((s, i) => `<li class="${nums[i].split(".").length > 2 ? "sub" : ""}"><span class="n">${nums[i]}</span> <button type="button" data-sec="${i}">${chb(s, nums[i].split(".").length > 2)}${esc(s.heading)}</button></li>`).join("")}</ul></nav>` : "";
  const stNotice = story && storyOn(w) && p.storyNotice ? `<div class="notice"><div>이 문서는 진행 중인 사건을 다룹니다. (현재 ${w.story.chapter}장)</div></div>` : "";
  const miss = story && !held ? missingChs(w, k) : [];
  const holdTail = " 끝나면 바뀐 내용을 보여 드립니다. 지금은 이전 버전입니다.";
  const syncHtml = !story ? "" : S.storyGen && held ? `<p class="memo-line"><span class="dot"></span>${S.storyGen.n}장을 반영한 이 문서를 ${S.storyGen.phase === "fix" ? `설정과 어긋난 ${S.storyGen.nFix}곳을 고치는 중…` : "설정과 맞춰 보는 중…"}${holdTail}</p>`
    : S.syncing === k ? `<p class="memo-line"><span class="dot"></span>${S.syncPhase?.phase === "check" ? "반영한 장 섹션을 설정과 맞춰 보는 중…" + holdTail : S.syncPhase?.phase === "fix" ? `반영한 장 섹션에서 설정과 어긋난 ${S.syncPhase.nFix}곳을 고치는 중…` + holdTail : `${missingChs(w, k).join(", ")}장의 변화를 이 문서에 반영하는 중…`}</p>`
    : S.syncErr?.key === k ? `<div class="banner warn">${miss.join(", ")}장의 변화를 반영하지 못했습니다. ${esc(S.syncErr.msg)} <button type="button" class="btn" data-act="sync-retry" style="margin-left:6px;padding:2px 10px" ${!S.sample ? "disabled" : ""}>다시 시도</button></div>`
    : miss.length ? `<p class="memo-line"><span class="dot"></span>${miss.join(", ")}장의 변화를 반영할 차례를 기다리는 중</p>` : "";

    <div class="row" style="margin-top:6px"><button type="button" class="btn" data-mgdo="${k}" data-mgto="${twin}" ${S.gen || S.storyGen || S.syncing ? "disabled" : ""}>같은 대상이니 합치기</button><button type="button" class="btn" data-notsame="${k}" data-other="${twin}">다른 대상입니다</button></div></div>` : "";
  const mergeBox = S.confirmMerge === k ? `<div class="rwbox">

/* ---------- search ---------- */
function renderSugg() {
  const box = $("#sugg"), q = norm($("#q").value), w = S.world;
  if (!w || !q) { box.hidden = true; box.innerHTML = ""; return; }
  const ql = q.toLowerCase();
  const hits = Object.entries(w.entities).filter(([, o]) => o.title.toLowerCase().includes(ql)).sort((a, b) => (b[1].page - a[1].page) || a[1].title.length - b[1].title.length).slice(0, 7);
  const exact = hits.some(([, o]) => o.title.toLowerCase() === ql);
  box.innerHTML = hits.map(([k, o]) => `<button type="button" data-sk="${k}"><span>${esc(o.title)}</span><small>${o.page ? "문서" : "미작성"}</small></button>`).join("")
    + (exact ? "" : `<button type="button" data-snew="${esc(q)}"><span>「${esc(q)}」 문서 찾기</span><small>없으면 새로 작성</small></button><button type="button" data-scompose="${esc(q)}"><span>「${esc(q)}」 방향을 정해 새로 만들기</span><small>작성 페이지</small></button>`);
  box.hidden = false;
}
function composeFromSearch(title) {
  const w = S.world; const t = norm(title); if (!w || !t) return;
  const k = keyOf(t);
  if (!w.entities[k]) { w.entities[k] = newEntity(t, "", ""); w.entities[k].src = "guided"; w.entities[k].searched = true; }
  S.nf.delete(k);
  $("#q").value = ""; renderSugg(); $("#q").blur(); openCompose(k);
}
function goSearch(title) {
  const w = S.world; const t = canonTitle(w, title); if (!w || !t) return;   // 합쳐진 이름이나 성만 쓴 이름은 원래 문서로
  const k = keyOf(t);
  if (!w.entities[k] && S.nf.has(k)) { $("#q").value = ""; renderSugg(); $("#q").blur(); S.view = { name: "notfound", title: t }; renderAll(); window.scrollTo({ top: 0 }); return; }
  if (!w.entities[k]) { w.entities[k] = newEntity(t, "", ""); w.entities[k].src = "search"; w.entities[k].searched = true; }
  $("#q").value = ""; renderSugg(); $("#q").blur(); openEntity(k);
}

/* ---------- toast ---------- */
let toastT;
function toast(msg, action) {
  const t = $("#toast"); t.innerHTML = esc(msg) + (action ? `<button type="button" id="toastAct">${esc(action.label)}</button>` : "");
  t.hidden = false; if (action) $("#toastAct").onclick = () => { t.hidden = true; action.fn(); };
  clearTimeout(toastT); toastT = setTimeout(() => { t.hidden = true; }, action ? 7000 : 3600);
}

/* ---------- events ---------- */
document.addEventListener("click", ev => {
  if (!ev.target.closest(".portrait-menu")) document.querySelectorAll(".portrait-menu[open]").forEach(m => { m.open = false; });
  if (!ev.target.closest(".search")) $("#sugg").hidden = true;
  const el = ev.target.closest("button, a"); if (!el) return;
  const d = el.dataset;
  if (el.matches("a.wl.new")) {
    ev.preventDefault();
    if (lp.fired) { lp.fired = false; return; }               // 길게 누르기로 이미 작성 페이지를 열었음
    const w = S.world; if (!w) return;
    const k = d.k; if (!w.entities[k] && d.t) w.entities[k] = newEntity(d.t, "", "");
    if (lp.touch) { openEntity(k); return; }                   // 터치는 짧게 누르면 바로 작성
    if (ev.detail >= 2) { clearTimeout(lp.clickT); lp.clickT = null; openCompose(k); return; }
    clearTimeout(lp.clickT); lp.clickT = setTimeout(() => { lp.clickT = null; openEntity(k); }, 260);
    return;
  }
  if (el.matches("a.wl") || (el.tagName === "BUTTON" && d.k)) { ev.preventDefault(); const w = S.world; if (!w) return; let k = d.k; if (!w.entities[k] && d.t) w.entities[k] = newEntity(d.t, "", ""); openEntity(k); return; }
  if (d.fn) { ev.preventDefault(); const li = document.getElementById("fn-" + d.fn); if (li) { li.scrollIntoView({ block: "center", behavior: "smooth" }); li.classList.add("flash"); setTimeout(() => li.classList.remove("flash"), 1600); } return; }
  if (d.sec) { document.getElementById("s-" + d.sec)?.scrollIntoView({ behavior: "smooth" }); return; }
  if (d.sk) { $("#q").value = ""; $("#sugg").hidden = true; openEntity(d.sk); return; }
  if (d.snew) { goSearch(d.snew); return; }

  if (d.force) { const w = S.world; if (!w) return; const t = norm(d.force), k = keyOf(t); S.nf.delete(k); if (!w.entities[k]) w.entities[k] = newEntity(t, "", ""); w.entities[k].src = "force"; S.genErr = null; openEntity(k); return; }
  if (d.stab) {
    S.seedTab = d.stab;
    if (!/^\d+$/.test(d.stab) && EXAMPLES.some(x => x.guide && x.guide === S.guideIn)) S.guideIn = "";   // 예시가 채운 작가 지침은 다른 탭으로 옮기면 비운다(직접 고친 지침은 둔다)
    if (d.stab === "own") S.seed = S.ownSeed;
    else if (d.stab === "dice") { if (!S.dice) rollDice(); S.seed = diceSeed(S.dice); }
    else if (d.stab === "whatif") { if (!S.whatIfs) S.whatIfs = shuffle(WHATIFS).slice(0, 8); }
    else { const ex = EXAMPLES[+d.stab]; S.seed = ex.text; if (ex.guide && (!S.guideIn.trim() || EXAMPLES.some(x => x.guide === S.guideIn))) S.guideIn = ex.guide; }   // 작가 지침은 비어 있거나 다른 예시의 것일 때만 채운다
    renderMain(); return;
  }
  if (d.lock) { S.dice.locks[d.lock] = !S.dice.locks[d.lock]; renderMain(); return; }
  if (d.whatif) { S.seed = whatIfSeed(d.whatif); createWorld(); return; }

  if (d.mg) { S.confirmMerge = S.confirmMerge === d.mg ? null : d.mg; S.confirmDelPage = null; S.confirmRewrite = null; renderMain(); if (S.confirmMerge) $("#mgTo")?.focus(); return; }
  if (d.mgYes) { const w = S.world, v = norm($("#mgTo")?.value || ""); if (!w || !v) { toast("합칠 문서 제목을 골라 주세요."); return; } const t = keyOf(v), bk = w.entities[t] ? t : kOf(w, v); if (!w.entities[bk] || bk === d.mgYes) { toast(`「${v}」 항목을 찾을 수 없습니다. 목록에서 골라 주세요.`); return; } mergeAction(d.mgYes, bk); return; }

  if (d.epsec) { const w = S.world; if (!w) return; const pk = w.story.protagonistKey, i = d.epsec; S.view = { name: "article", key: pk }; renderAll(); const el = document.getElementById("s-" + i); if (el) el.scrollIntoView({ block: "start" }); return; }

    case "delpage-no": S.confirmDelPage = null; renderMain(); break;

/* ---------- 본문 글을 골라 링크로 만들기 ----------
 * 본문의 평문을 드래그(모바일은 길게 눌러 선택)하면 버튼이 뜨고, 누르면 그 자리를 [[ ]]로 감싼다. 없는 항목이면 빨간 링크가 된다.
 * 화면의 글과 원문을 맞추는 법: 링크·각주 안의 글은 양쪽에서 모두 빼고(굵게·취소선은 기호만 뺀다), 고른 글이 그 문단에서 몇 번째로 나오는지로 원문 위치를 찾는다. */
const SEL_SKIP = "a, sup";
function plainNodes(root) {   // 링크·각주·서식 밖의 글 조각들
  const out = [], tw = document.createTreeWalker(root, NodeFilter.SHOW_TEXT);
  for (let n = tw.nextNode(); n; n = tw.nextNode()) if (!n.parentElement.closest(SEL_SKIP)) out.push(n);
  return out;
}
function maskSource(t) {   // 원문과 같은 길이로, 화면에 평문으로 나오지 않는 부분(링크, 각주, 굵게·취소선 기호)은 \0으로 가린다

  const hide = (i, j) => { for (let x = i; x < j; x++) a[x] = "\0"; };
  for (let i = 0; i < t.length; i++) if (t[i] === "[" && t[i + 1] === "*") { let d = 1, j = i + 2; while (j < t.length && d > 0) { if (t[j] === "[") d++; else if (t[j] === "]") d--; j++; } if (d === 0) { hide(i, j); i = j - 1; } }

/* 지금 선택이 링크로 만들 수 있는 글이면 { k, bi, n, text } */
function selTarget() {

  if (node !== r.endContainer || node.nodeType !== 3) return null;   // 한 글 조각 안에서만(링크나 서식 경계를 넘지 않게)
  const secb = node.parentElement.closest(".article .secb"); if (!secb || node.parentElement.closest(SEL_SKIP)) return null;
  const v = S.view; if (v.name !== "article" || !S.world || !S.pages[v.key]) return null;
  let a = r.startOffset, b = r.endOffset; const raw = node.data;
  while (a < b && /\s/.test(raw[a])) a++; while (b > a && /\s/.test(raw[b - 1])) b--;
  const text = raw.slice(a, b); if (!text || text.length > 60 || /[\[\]|*~\n]/.test(text)) return null;

  for (const x of plainNodes(secb)) {
    const d = x.data, end = x === node ? a : Infinity;
    for (let i = d.indexOf(text); i >= 0 && i < end; i = d.indexOf(text, i + 1)) n++;
    if (x === node) break;
  }
  return { k: v.key, where: secb.dataset.ib != null ? ["infobox", +secb.dataset.ib, "value"] : ["sections", +secb.dataset.bi, "body"], n, text, range: r };   // 섹션 본문 또는 인포박스 값
}
function selBusy(k) {
  const w = S.world;
  if (S.edit) return "편집 중에는 링크를 만들 수 없습니다.";
  if (S.gen?.key === k || S.syncing === k || isHeld(k) || (S.storyGen && isStory(w) && k === w.story.protagonistKey)) return "이 문서를 작성하거나 맞춰 보는 중입니다. 끝난 뒤 다시 해 주세요.";
  return "";
}
async function linkSelection(t) {
  const w = S.world, p = S.pages[t.k]; if (!w || !p) return;
  const busy = selBusy(t.k); if (busy) { toast(busy); return; }
  const [list, idx, fld] = t.where, sec = p[list]?.[idx]; if (!sec || typeof sec[fld] !== "string") return;

  selPop.style.display = "block";

  let top = rc.bottom + 8; if (top + bh > innerHeight - 12) top = Math.max(12, rc.top - bh - 8);   // 모바일 기본 메뉴(위쪽)와 겹치지 않게 아래에 둔다
  selPop.style.top = top + "px"; selPop.style.left = Math.max(16, Math.min(innerWidth - bw - 16, rc.left + rc.width / 2 - bw / 2)) + "px";

let selTimer = null;
document.addEventListener("selectionchange", () => { clearTimeout(selTimer); selTimer = setTimeout(showSelPop, 180); });
addEventListener("scroll", () => { if (selT) showSelPop(); }, { passive: true });

  setInterval(() => { if (S.gen) updateGenLive(); if (S.storyGen) updateStoryLive(); const ct = $("#chkTick"); if (ct && S.checking && S.checkT0) ct.textContent = Math.floor((performance.now() - S.checkT0) / 1000) + "초"; const t = $("#fxTick"); if (t && S.fixv?.t0) t.textContent = Math.floor((performance.now() - S.fixv.t0) / 1000) + "초"; }, 1000);
  const inv = /(?:^#|&)relay=([^&]+)/.exec(location.hash || "");   // 초대 링크(#relay=주소)로 들어오면 중계 서버 주소를 채운다
