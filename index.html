<!doctype html><html><head><meta charset=utf8><meta name=viewport content="width=device-width,initial-scale=1,viewport-fit=cover"><style>:root{color-scheme:light;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}html{scroll-padding-top:env(safe-area-inset-top,0px)}body{margin:0;padding:0;font:14px -apple-system,BlinkMacSystemFont,sans-serif;background:#fff;color:#000}img{max-width:100%}[hidden]:not([hidden=until-found i]){display:none!important}</style></head><body>
<title>WorldWiki.ai · Gemini</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500&family=IBM+Plex+Sans+KR:wght@400;500;600&family=Noto+Serif+KR:wght@600;700&display=swap">
<style>
/* Layout: wiki shell — sticky search bar, narrow navigation rail, white article sheet with floated infobox. Red links = 미작성 문서. */
:root{
  --paper:#F3F5F8; --sheet:#FFFFFF; --ink:#17202A; --muted:#5D6774; --line:#DBE0E7; --tint:#ECF0F5;
  --link:#2353BF; --red:#B4372B; --accent:#17202A; --on-accent:#FFFFFF;
  --warn-bg:#FFF3DC; --warn-fg:#7E4B00; --ok:#2E7A4C; --hl:#FFF4C2;
  --f-display:"Noto Serif KR","Nanum Myeongjo","Apple SD Gothic Neo",serif;
  --f-body:"IBM Plex Sans KR","Apple SD Gothic Neo","Malgun Gothic",system-ui,sans-serif;
  --f-mono:"IBM Plex Mono",ui-monospace,"SFMono-Regular",Menlo,monospace;
  --r:6px;
}
@media (prefers-color-scheme: dark){ :root:not([data-theme="light"]){
  --paper:#0E1217; --sheet:#151A21; --ink:#E4E9EF; --muted:#98A2AF; --line:#29313B; --tint:#1C232C;
  --link:#88A9FF; --red:#F08A7D; --accent:#E4E9EF; --on-accent:#0E1217;
  --warn-bg:#382A10; --warn-fg:#F2C47C; --ok:#6CC491; --hl:#3A3413; color-scheme:dark }}
:root[data-theme="dark"]{
  --paper:#0E1217; --sheet:#151A21; --ink:#E4E9EF; --muted:#98A2AF; --line:#29313B; --tint:#1C232C;
  --link:#88A9FF; --red:#F08A7D; --accent:#E4E9EF; --on-accent:#0E1217;
  --warn-bg:#382A10; --warn-fg:#F2C47C; --ok:#6CC491; --hl:#3A3413; color-scheme:dark }

*{box-sizing:border-box}
body{background:var(--paper);color:var(--ink);font-family:var(--f-body);font-size:14px;line-height:1.6;-webkit-font-smoothing:antialiased}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:10;background:var(--sheet)}
button,input,textarea,select{font:inherit;color:inherit}
a{color:var(--link)}
:focus-visible{outline:2px solid var(--link);outline-offset:2px}
.wrap{padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}

/* top bar */
.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:5;background:var(--sheet);border-bottom:1px solid var(--line)}
.top-in{max-width:1180px;margin:0 auto;display:flex;align-items:center;gap:16px;padding-block:10px;flex-wrap:wrap}
.brand{display:flex;align-items:baseline;gap:10px;min-width:0;background:none;border:0;padding:0;cursor:pointer;text-align:left}
.brand b{font-family:var(--f-display);font-weight:700;font-size:19px;letter-spacing:-.01em;white-space:nowrap}
.brand span{font-family:var(--f-mono);font-size:11.5px;color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:40vw}
.search{position:relative;margin-left:auto;flex:1 1 260px;max-width:420px}
.search input{width:100%;border:1px solid var(--line);background:var(--paper);border-radius:var(--r);padding:8px 12px;font-size:14px}
.search input:disabled{opacity:.55}
.sugg{position:absolute;left:0;right:0;top:calc(100% + 4px);background:var(--sheet);border:1px solid var(--line);border-radius:var(--r);box-shadow:0 8px 24px rgb(0 0 0 / .12);overflow:hidden}
.sugg button{display:flex;justify-content:space-between;gap:12px;width:100%;text-align:left;background:none;border:0;padding:8px 12px;cursor:pointer}
.sugg button:hover,.sugg button:focus-visible{background:var(--tint)}
.sugg small{font-family:var(--f-mono);color:var(--muted);font-size:11px}

/* shell */
.shell{max-width:1180px;margin:0 auto;display:grid;grid-template-columns:210px minmax(0,1fr);gap:24px;padding-block:24px 64px}
.side{display:flex;flex-direction:column;gap:20px;font-size:13.5px}
.side h4{margin:0 0 6px;font-family:var(--f-mono);font-weight:500;font-size:11px;letter-spacing:.08em;text-transform:uppercase;color:var(--muted)}
.side ul{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:2px}
.side li button,.side li a{display:block;width:100%;text-align:left;background:none;border:0;padding:3px 0;cursor:pointer;color:var(--link);text-decoration:none;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.side li button:hover{text-decoration:underline}
.side li button.cur{color:var(--ink);font-weight:600}
.stat{font-family:var(--f-mono);font-size:12px;color:var(--muted);display:flex;flex-direction:column;gap:2px}
.stat em{font-style:normal;color:var(--ink)}
.genpill{display:flex;align-items:center;gap:8px;font-size:12.5px;color:var(--muted)}
.dot{width:8px;height:8px;border-radius:50%;background:var(--link);animation:pulse 1.2s ease-in-out infinite;flex:none}
@keyframes pulse{50%{opacity:.25}}
main{min-width:0}

/* sheet */
.sheet{background:var(--sheet);border:1px solid var(--line);border-radius:var(--r);padding:28px 32px 36px}
.crumb{font-family:var(--f-mono);font-size:11.5px;color:var(--muted);letter-spacing:.02em;display:flex;gap:10px;flex-wrap:wrap}
h1.t{font-family:var(--f-display);font-weight:700;font-size:30px;line-height:1.25;letter-spacing:-.015em;margin:6px 0 4px;text-wrap:balance;padding-bottom:12px;border-bottom:1px solid var(--line)}
.tools{display:flex;gap:8px;flex-wrap:wrap;margin:12px 0 4px}
.btn{display:inline-flex;align-items:center;gap:6px;border:1px solid var(--line);background:var(--sheet);border-radius:var(--r);padding:6px 12px;font-size:13px;cursor:pointer;color:var(--ink)}
.btn:hover{background:var(--tint)}
.btn:disabled{opacity:.5;cursor:not-allowed}
.btn.pri{background:var(--accent);color:var(--on-accent);border-color:var(--accent);font-weight:600}
.btn.pri:hover{opacity:.9}
.btn.dng{color:var(--red)}
.confirm{display:inline-flex;align-items:center;gap:8px;flex-wrap:wrap;font-size:13px;background:var(--tint);border-radius:var(--r);padding:4px 4px 4px 12px}

.article{font-size:15px;line-height:1.8}
.lead{margin:18px 0 0}
.infobox{float:right;width:280px;margin:16px 0 16px 24px;border:1px solid var(--line);border-radius:var(--r);font-size:13px;line-height:1.55;overflow:hidden;background:var(--sheet)}
.infobox .ih{background:var(--tint);padding:10px 12px;font-family:var(--f-display);font-weight:700;font-size:15px;text-align:center}
.infobox .ity{font-family:var(--f-mono);font-size:11px;color:var(--muted);text-align:center;padding:4px 0 2px;border-bottom:1px solid var(--line)}
.infobox table{width:100%;border-collapse:collapse}
.infobox th,.infobox td{padding:6px 10px;border-top:1px solid var(--line);vertical-align:top;text-align:left}
.infobox tr:first-child th,.infobox tr:first-child td{border-top:0}
.infobox th{width:36%;font-weight:600;color:var(--muted);font-size:12.5px}
.toc{display:inline-block;border:1px solid var(--line);background:var(--paper);border-radius:var(--r);padding:10px 16px 12px;margin:20px 0 4px;font-size:13.5px;min-width:200px;max-width:100%}
.toc b{font-family:var(--f-mono);font-weight:500;font-size:11px;letter-spacing:.08em;color:var(--muted)}
.toc ol{margin:6px 0 0;padding-left:20px}
.toc button{background:none;border:0;padding:1px 0;cursor:pointer;color:var(--link);text-align:left}
.article h2{font-family:var(--f-display);font-weight:700;font-size:21px;line-height:1.35;margin:30px 0 8px;padding-bottom:6px;border-bottom:1px solid var(--line);text-wrap:balance;clear:none}
.article h2 .n{color:var(--link);margin-right:8px;font-variant-numeric:tabular-nums}
.article h3{font-size:16px;margin:18px 0 4px}
.article p{margin:0 0 12px}
.article ul{margin:0 0 12px;padding-left:22px}
.article del{color:var(--muted)}
.article ul ul{margin:2px 0 4px;padding-left:20px;list-style:circle}
.article blockquote{display:table;max-width:100%;margin:6px 0 16px;padding:12px 18px;border:1px dashed var(--line);border-radius:var(--r);background:var(--paper);font-family:var(--f-display);font-weight:600;font-size:15px;line-height:1.7}
.article blockquote cite{display:block;margin-top:8px;padding-top:6px;border-top:1px solid var(--line);font-family:var(--f-body);font-style:normal;font-weight:400;font-size:13px}
.article h3.sh{font-family:var(--f-display);font-weight:700;font-size:17px;margin:22px 0 6px;padding-bottom:4px;border-bottom:1px solid var(--line)}
.article h3.sh .n{color:var(--link);margin-right:8px;font-variant-numeric:tabular-nums}
.ed .ed-2{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,2fr);gap:0 14px}
.ed textarea{font-size:14px;line-height:1.7}
.ed #edBody,.ed #edNavbox,.ed #edInfobox{font-family:var(--f-mono),var(--f-body);font-size:13.5px}
.ed-help{margin:8px 0 0;font-size:13px}
.ed-help summary{cursor:pointer;color:var(--link)}
.ed-help .kv{margin:8px 0 0;padding:10px 12px;border:1px solid var(--line);border-radius:var(--r);background:var(--paper)}
.ed-help dt{font-family:var(--f-mono);color:var(--ink)}
@media (max-width:560px){.ed .ed-2{grid-template-columns:minmax(0,1fr)}}
.cfpanel{margin:14px 0 4px;padding:14px;border:1px solid var(--warn-fg);border-radius:var(--r);background:var(--warn-bg);color:var(--ink);display:flex;flex-direction:column;gap:10px}
.cfpanel>b{color:var(--warn-fg)}
.cfpanel .note{margin:0}
.cf{background:var(--sheet);border:1px solid var(--line);border-radius:var(--r);padding:10px 12px;display:flex;flex-direction:column;gap:4px;font-size:13.5px}
.cf-h{font-weight:600}
.cf-old,.cf-new{display:grid;grid-template-columns:52px minmax(0,1fr);gap:8px}
.cf-old span,.cf-new span{font-family:var(--f-mono);font-size:11px;color:var(--muted);padding-top:2px}
.cf-old{color:var(--muted)}
.cf-ch{display:flex;gap:6px;align-items:center;margin-top:6px;font-size:13px}
.cf .txt{margin-top:2px}
.rwbox{margin:10px 0 4px;padding:12px 14px;border:1px solid var(--line);border-radius:var(--r);background:var(--paper);max-width:640px}
.rwbox .note{margin:8px 0 0}
.rels{clear:both;margin-top:28px}
.rels h3{font-family:var(--f-display);font-size:17px;margin:0 0 8px;padding-bottom:4px;border-bottom:1px solid var(--line)}
.rels ul{list-style:none;margin:0;padding:0;display:grid;grid-template-columns:repeat(auto-fill,minmax(230px,1fr));gap:10px}
.rels li{border:1px solid var(--line);border-radius:var(--r);padding:10px 12px;display:flex;flex-direction:column;gap:4px;font-size:13.5px;min-width:0}
.rels li.sup{opacity:.55}
.rels .rel-h{display:flex;flex-wrap:wrap;gap:6px 8px;align-items:baseline;font-weight:600}
.rels .rel-k{font-weight:400;font-size:12px;color:var(--muted);border:1px solid var(--line);border-radius:999px;padding:0 8px}
.rels p{margin:0;line-height:1.6}
.navbox{margin:12px 0 0;border:1px solid var(--line);border-radius:var(--r);overflow:hidden;background:var(--sheet)}
.navbox summary{display:flex;align-items:center;justify-content:center;gap:8px;padding:8px 12px;background:var(--tint);cursor:pointer;list-style:none;font-weight:600;font-size:14px;text-align:center}
.navbox summary::-webkit-details-marker{display:none}
.navbox .nb-n{font-family:var(--f-mono);font-weight:400;font-size:11px;color:var(--muted);border:1px solid var(--line);border-radius:999px;padding:0 7px}
.navbox .nb-tog::before{content:"[펼치기]";font-weight:400;font-size:12px;color:var(--link)}
.navbox[open] .nb-tog::before{content:"[접기]"}
.nb-body{display:flex;flex-direction:column}
.nb-row{display:grid;grid-template-columns:minmax(90px,150px) minmax(0,1fr);border-top:1px solid var(--line)}
.nb-l{padding:8px 10px;background:var(--paper);font-weight:600;font-size:12.5px;color:var(--muted);border-right:1px solid var(--line)}
.nb-row ul{list-style:none;margin:0;padding:8px 12px;display:flex;flex-wrap:wrap;gap:4px 18px;font-size:13.5px;min-width:0}
.nb-row li{display:flex;flex-direction:column;line-height:1.35;min-width:0}
.nb-row li small{color:var(--muted);font-size:11.5px}
.nb-row li.me b{color:var(--ink)}
.nb-src{border-top:1px solid var(--line);padding:6px 12px;font-size:12px;text-align:right}
@media (max-width:560px){.nb-row{grid-template-columns:minmax(0,1fr)}.nb-l{border-right:0;border-bottom:1px solid var(--line)}}
.nf-h{font-family:var(--f-display);font-weight:700;font-size:20px;margin:20px 0 4px}
.cats{display:flex;flex-wrap:wrap;gap:4px 0;align-items:center;margin:10px 0 0;padding:6px 10px;border:1px solid var(--line);border-radius:var(--r);font-size:13px}
.cats b{font-weight:600;margin-right:8px}
.cats span{color:var(--link)}
.cats span+span::before{content:"|";color:var(--line);margin:0 8px}
.toc ul{list-style:none;margin:6px 0 0;padding:0}
.toc li.sub{padding-left:22px}
.toc .n{color:var(--link);font-variant-numeric:tabular-nums}
.notice{display:flex;flex-direction:column;gap:4px;margin:16px 0 0;padding:10px 14px;border:1px solid var(--line);border-radius:var(--r);background:var(--tint);font-size:13.5px;line-height:1.6}
a.wl{text-decoration:none}
a.wl:hover{text-decoration:underline}
a.wl.new{color:var(--red);-webkit-touch-callout:none;-webkit-user-select:none;user-select:none}
sup.fn a{font-size:11px;text-decoration:none;font-family:var(--f-mono)}
.fns{clear:both;margin-top:28px;padding-top:12px;border-top:1px solid var(--line);font-size:13px;color:var(--muted)}
.fns ol{padding-left:22px;margin:6px 0 0}
.fns li:target,.fns li.flash{background:var(--hl)}
.meta-foot{clear:both;margin-top:28px;display:flex;flex-direction:column;gap:10px;font-size:13px}
.meta-foot .box{border:1px solid var(--line);border-radius:var(--r);padding:8px 12px;background:var(--paper)}
.meta-foot b{font-weight:600;margin-right:6px}
.chips{display:inline-flex;gap:6px;flex-wrap:wrap}

.banner{border-radius:var(--r);padding:12px 14px;font-size:13.5px;margin:14px 0}
.banner.warn{background:var(--warn-bg);color:var(--warn-fg)}
.banner.ok{background:var(--tint);color:var(--ok)}
.banner ul{margin:6px 0 0;padding-left:18px}
.banner li{margin-bottom:4px}
.banner .sev{font-family:var(--f-mono);font-size:11px;font-weight:500;margin-right:6px}

/* generating */
.gen-live{font-family:var(--f-mono);font-size:12px;color:var(--muted);display:flex;gap:12px;flex-wrap:wrap;align-items:center}
.promise{margin:18px 0;border:1px dashed var(--line);border-radius:var(--r);padding:12px 14px;font-size:13.5px}
.promise h5{margin:0 0 6px;font-family:var(--f-mono);font-weight:500;font-size:11px;letter-spacing:.08em;color:var(--muted)}
.promise ul{margin:0;padding-left:18px}
.heads{margin:18px 0 0;padding:0;list-style:none;display:flex;flex-direction:column;gap:8px}
.heads li{font-family:var(--f-display);font-weight:600;font-size:17px;animation:in .3s ease-out}
@keyframes in{from{opacity:.2;transform:translateY(4px)}}
.sk{height:11px;border-radius:4px;background:var(--tint);margin:10px 0;animation:pulse 1.6s ease-in-out infinite}
.sk:nth-child(2){width:92%}.sk:nth-child(3){width:78%}.sk:nth-child(4){width:85%}

/* home */
.home{display:grid;grid-template-columns:minmax(0,1.15fr) minmax(0,1fr);gap:24px;align-items:start}
.home h2{font-family:var(--f-display);font-size:22px;margin:0 0 4px;text-wrap:balance}
.sub{color:var(--muted);margin:0 0 16px;max-width:60ch}
label.lb{display:block;font-weight:600;font-size:13px;margin:16px 0 6px}
input.txt{width:100%;border:1px solid var(--line);background:var(--paper);border-radius:var(--r);padding:9px 12px;font-size:14px}
textarea{width:100%;border:1px solid var(--line);background:var(--paper);border-radius:var(--r);padding:10px 12px;line-height:1.65;resize:vertical;font-size:14px}
.stabs{display:flex;flex-direction:column;gap:8px;margin:0 0 8px}
.stabs-row{display:flex;flex-wrap:wrap;align-items:center;gap:6px}
.stab{border:1px solid var(--line);background:var(--sheet);border-radius:999px;padding:4px 12px;font-size:12.5px;cursor:pointer;color:var(--ink)}
.stab:hover{background:var(--tint)}
.stab[aria-selected="true"]{background:var(--accent);color:var(--on-accent);border-color:var(--accent)}
.stab[data-stab="own"]{font-weight:600}
.dice{display:flex;flex-direction:column;gap:8px;margin:0 0 10px;padding:12px;border:1px solid var(--line);border-radius:var(--r);background:var(--paper)}
.die{display:grid;grid-template-columns:56px minmax(0,1fr) auto;gap:10px;align-items:center;background:var(--sheet);border:1px solid var(--line);border-radius:var(--r);padding:8px 10px}
.die-l{font-family:var(--f-mono);font-size:11px;color:var(--muted);letter-spacing:.06em}
.die-v{font-family:var(--f-display);font-weight:700;font-size:15.5px;line-height:1.4;min-width:0}
.die-lock{border:1px solid var(--line);background:var(--sheet);border-radius:999px;padding:2px 10px;font-size:12px;cursor:pointer;color:var(--muted)}
.die-lock[aria-pressed="true"]{background:var(--accent);color:var(--on-accent);border-color:var(--accent)}
.whatif{margin:0 0 10px}
.wi-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(200px,1fr));gap:8px}
.wi{display:flex;flex-direction:column;gap:2px;text-align:left;border:1px solid var(--line);background:var(--sheet);border-radius:var(--r);padding:10px 12px;cursor:pointer;color:var(--ink);font-family:var(--f-display);font-weight:600;font-size:14.5px;line-height:1.45}
.wi span{font-family:var(--f-mono);font-weight:400;font-size:10.5px;color:var(--muted);letter-spacing:.08em}
.wi:hover:not(:disabled){border-color:var(--ink);background:var(--tint)}
.wi:disabled{opacity:.5;cursor:not-allowed}
.stab-sep{font-family:var(--f-mono);font-size:11px;color:var(--muted);letter-spacing:.06em;margin-right:4px}
.ex{display:flex;gap:6px;flex-wrap:wrap;margin-top:8px}
.chip{border:1px solid var(--line);background:var(--sheet);border-radius:999px;padding:4px 11px;font-size:12.5px;cursor:pointer;color:var(--ink)}
.chip:hover{background:var(--tint)}
.chip[aria-pressed="true"]{background:var(--accent);color:var(--on-accent);border-color:var(--accent)}
.row{display:flex;gap:10px;align-items:center;flex-wrap:wrap;margin-top:18px}
.note{font-size:12.5px;color:var(--muted)}
.wlist{display:flex;flex-direction:column;gap:10px}
.wcard{border:1px solid var(--line);background:var(--sheet);border-radius:var(--r);padding:14px 16px;display:flex;flex-direction:column;gap:6px}
.wcard button.open{background:none;border:0;padding:0;text-align:left;cursor:pointer;font-family:var(--f-display);font-weight:700;font-size:17px;color:var(--link)}
.wcard p{margin:0;color:var(--muted);font-size:13px}
.wcard .wm{display:flex;justify-content:space-between;align-items:center;gap:10px;flex-wrap:wrap;font-family:var(--f-mono);font-size:11.5px;color:var(--muted)}
.empty{border:1px dashed var(--line);border-radius:var(--r);padding:18px;color:var(--muted);font-size:13.5px}
.how{margin:22px 0 0;padding:0;list-style:none;display:grid;gap:10px;font-size:13px;color:var(--muted)}
.how li{display:grid;grid-template-columns:22px 1fr;gap:8px}
.how li span{font-family:var(--f-mono);color:var(--ink)}

/* canon */
.canon h2{font-family:var(--f-display);font-size:19px;margin:28px 0 8px}
.canon h2:first-of-type{margin-top:18px}
.tl{width:100%;border-collapse:collapse;font-size:13.5px}
.tl td{padding:6px 8px;border-top:1px solid var(--line);vertical-align:top}
.tl td:first-child{font-family:var(--f-mono);white-space:nowrap;color:var(--muted);width:1%;font-variant-numeric:tabular-nums}
.tabs{display:flex;gap:6px;flex-wrap:wrap;margin:6px 0 10px}
details.ent{border-top:1px solid var(--line);padding:6px 0}
details.ent summary{cursor:pointer;display:flex;gap:10px;align-items:baseline;flex-wrap:wrap;list-style:none}

## 이 문서의 엔진 (가장 중요)
쓰기 전에 아래 다섯 가지를 먼저 정하고, 문서 전체를 이것을 중심으로 짠다. 그 아래의 규칙들은 이 엔진을 해치지 않는 범위에서 지키는 품질 기준이다.
1. 훅: 이 문서를 읽은 사람이 친구에게 "그거 알아?" 하고 전할 만한 사실 하나. 개요의 첫 두 문장 안에 둔다.
2. 절정: 이 항목이 걸린 가장 극적인 순간 하나. 절정에서는 실제로 무언가가 벌어져야 한다. 긴장만 쌓다가 행정 처리나 협상으로 넘어가지 말고, 이 장르의 핵심 행동(전투, 결투, 능력의 발현, 결정적 결단이나 배신)이 일어나는 순간을 고른다. 이 항목이 인물이면 그 인물이 직접 행동하거나 말하는 순간을 고르고, 주변 인물이 주인공을 대신하게 하지 않는다. 문서에서 가장 넉넉한 분량을 이 순간에 주고, 그때 무엇이 보이고 들렸는지, 그 자리의 사람들이 무엇을 했는지 장면으로 쓴다. 당시의 기록(신문 기사, 일기, 교신)을 직접 인용한다면 여기에 쓰는 것이 좋다. 문서의 나머지는 이 순간으로 가는 길과 그 뒤의 여파다.
3. 큰길: 이 세계의 가장 큰 비틀기나 사건이 이 항목을 통해 피부에 와닿는 장면을 한 번 이상 쓴다. 다른 문서와 겹치는 설정이라도 이 항목의 자리에서 본 모습이라면 반복이 아니다.
4. 사람의 끝: 이 문서에 이름이 나온 주요 인물(3~4명까지)은 무엇을 원했고 결국 어떻게 되었는지를 이 문서 안에서 마무리한다. 직함만 있고 사라지는 사람을 남기지 않는다. 이것을 한곳에 모아 정리하지 말고, 각자의 이야기가 끝나는 자리에서 쓴다.
5. 열린 질문: 이 항목이 세계의 수수께끼에 닿아 있다면, 작중 사람들이 그것을 어떻게 설명하는지(가설, 학파, 종교적 해석, 음모론)와 각각을 누가 믿고 주장하는지 쓴다. 정답을 단정하지 않아도 되지만 가설은 구체적이어야 한다. 이것은 얼버무리는 공백과 다르다.

- 연표에 없던 사건을 1~3개 새로 확정한다.

## 문장 기준
- 구체성은 의미 있는 디테일이다. 숫자는 그 숫자가 무엇을 뜻하는지 드러날 때만 쓰고, 예산 내역이나 인원수 나열로 분량을 채우지 않는다. "다양한", "중요한 역할을 했다", "큰 영향을 미쳤다", "많은 사람들이" 대신 고유명사와 일화를 쓴다. 어떤 디테일이 어울리는지는 분위기 지침을 따른다.
- 단정형으로 쓴다. "밝혀지지 않았다", "공개되지 않았다", "기밀이다", "기록에 남아 있지 않다", "공식 입장을 내지 않았다", "~라고 전해진다" 같은 얼버무림은 쓰지 않는다. 조직의 반응은 실제로 한 조치(발표, 징계, 해명, 소송)로 쓴다.
- "~의 근거가 되었다", "~의 계기가 되었다", "~의 시초가 되었다", "~의 토대가 되었다", "~의 상징이 되었다", "오늘날까지 이어지고 있다" 같은 연결 상투구는 문서 전체에서 많아야 한 번이다. 한 일이 다른 일로 이어졌다면 누가 언제 무엇을 했는지 장면으로 쓴다.
- 발언은 간접 인용으로 내용만 옮기는 것이 기본이다. 본문 중간에 큰따옴표 대사를 넣고 "~라고 말했다"로 받지 않는다. 직접 인용은 문서 전체에서 1~2개. 절정의 순간에 나온 말이나 작중에서 회자되는 한마디를 우선하며, 인물 문서라면 주인공 본인의 말을 우선한다. 인용할 때는 "> " 인용문 상자로 따로 두고 다음 줄에 "> — 화자, 출처"를 붙인다. 격언처럼 다듬은 말은 쓰지 않고 화자의 말투와 상황이 드러나게 한다.
- "A가 아니라 B였다", "A보다 B였다" 같은 반전 대구는 인용문, 개요, 본문 어디에서도 쓰지 않는다. 이 세계에 없는 현실의 고사나 관용구(아킬레스건, 루비콘 등)도 쓰지 않는다.
- 개요는 훅과 정의를 중심으로 짧게 쓴다. 진영별 이름, 규모 비교, 후대 평가 같은 정보를 개요에 몰아넣지 않고 맞는 섹션에 둔다.
- 근거 없는 칭찬은 하지 않되 강한 것은 강하다고 쓴다. 강함은 형용사가 아니라 비교 대상, 전과, 상대가 치른 대가로 보여 준다. 실패와 갈등은 흐름 속에서 쓰고, "~라는 비판이 있다. 반면 ~" 식의 양론 정리는 실제 논쟁이 있을 때만 쓴다.
- 풍습, 은어, 속설은 이 항목이 직접 원인이거나 핵심 소재일 때만 다루고, 새로 만드는 것은 문서당 많아야 하나다.

- 하이퍼링크: 다른 항목은 [[제목]] 또는 [[제목|본문에 보일 말]]로 감싼다. 링크는 공격적으로 건다. 본문과 인포박스에 나오는 단어 중 따로 문서가 될 만한 것은 처음 나올 때 모두 링크한다. 이름 있는 인물, 장소, 조직, 사건, 문서나 기록, 물건, 제도, 그리고 이 세계에만 있는 용어(예: 어떤 존재들의 방언, 고유한 직업이나 의식)가 여기에 해당한다. 본문에 이름이 나온 인물, 조직, 장소, 사건은 처음 나올 때 빠짐없이 링크하며, 이 규칙은 아래 개수 목표보다 우선한다. 그 밖의 용어까지 합친 목표는 문서당 12~18개이고, 꼭 눌러 보고 싶은 것부터 건다. 이미 있는 항목도 본문에 자연스럽게 나왔다면 위 목록의 제목을 글자 그대로 써서 링크한다. 다만 링크하려고 기존 항목을 "~의 사례로 꼽힌다", "~와도 관련이 있다"처럼 억지로 끌어오지는 않는다. 현실의 일반 명사(소, 정오, 철도)는 이 세계에서 특별한 의미가 없으면 링크하지 않는다. 자기 자신은 링크하지 않고, 같은 대상은 처음 한 번만 링크한다.
- 인포박스: 유형에 맞는 4~8개 항목(label/value). value에도 [[링크]]를 쓸 수 있다. 인물이면 해당하는 경우 배우자, 자녀 같은 가족 항목을 넣는다. 전투나 전쟁이면 기간, 장소, 교전 세력, 지휘관(전사한 사람은 이름 뒤에 †), 전력, 피해, 결과를 넣고, 양측이 있는 항목은 value 안에서 "진영 A: … / 진영 B: …"로 나란히 쓴다.
- 틀(navboxes): 이 항목 자체가 구성원이 정해진 집단(부대, 팀, 중대, 위원회, 내각, 기사단, 밴드, 가문, 왕조, 기수, 함대, 특정 기체 계열 등)이면 구성원 명단을 틀로 만든다.
  - 구성원이 40명 이하면 한 명도 빼지 않고 전원을 쓴다. 그보다 많으면 지휘부와 주요 구성원, 하위 단위를 정리한다.
  - 모든 구성원에게 고유한 이름을 붙이고 [[링크]]한다. 각 항목은 "[[이름]] — 짧은 설명" 형식이며, 설명에는 번호, 역할, 현재 상태(전사, 실종, 퇴역, 교체 등) 중 해당하는 것을 쓴다.
  - 행(rows)은 기수, 시기, 소속, 역할 등 이 집단에 맞는 기준으로 나눈다. 교체되거나 떠난 구성원도 포함한다.
  - 본문과 인포박스가 말하는 인원수, 번호, 결원과 보충 내역이 틀과 정확히 일치해야 한다. 이미 확정된 구성원 정보(위의 확정 사실과 언급)와도 일치시킨다.
  - 집단이 아니거나, 이 항목이 다른 틀의 구성원일 뿐이면 빈 배열. 틀의 링크는 본문 링크 개수 제한에 포함하지 않는다.
- 위의 확정 사실, 언급, 핵심 규칙, 연표, 사용자 확정 설정과 모순되는 내용은 쓰지 않는다. "[사용자 확정]"이 붙은 사실은 다른 문서의 언급과 엇갈리면 이쪽을 따른다. 날짜, 생몰과 나이, 소속, 사건의 결과를 특히 주의한다.
- 본문 서식: 문단은 빈 줄로 구분, 목록은 "- ", 하위 목록은 "  - ", 인용문은 "> ", 강조는 **굵게**. 각주와 취소선은 쓰지 않는다.
- 안내 틀(notices)은 빈 배열로 둔다.

## 출력
JSON 객체 하나만 출력:
{"title":"${e.title}","type":"${TYPES.join("|")} 중 하나","summary":"한 문장 정의(링크 없이)","categories":["분류 3~6개"],"notices":["..."],"infobox":[{"label":"...","value":"..."}],"sections":[{"heading":"개요","level":1,"body":"..."},{"heading":"생애","level":1,"body":""},{"heading":"1959년 데뷔","level":2,"body":"..."}],"facts":[{"about":"항목 제목","fact":"이 문서에서 확정한, 그 항목에 관한 사실 한 문장"}],"relations":[{"a":"인물 제목","b":"인물 제목","rel":"관계 이름(예: 스승과 제자, 맞수, 의절한 부자)","story":"관계가 어떻게 시작해 어떻게 변했는지 한두 문장, 시점 포함"}],"navboxes":[{"title":"틀 제목(예: ○○ 구성원)","rows":[{"label":"행 이름(예: 창설 대원)","items":["[[이름]] — 1번, 역할"]}]}],"newEntities":[{"title":"새로 링크한 항목 제목","type":"유형","summary":"한 문장 정의"}],"timeline":[{"year":"연도","event":"이 문서에서 새로 확정한 주요 사건"}]}
relations에는 이 문서가 새로 확정한 인물 사이의 관계를 넣는다. 이 항목이 인물이면 주요 관계 3~6개를 반드시 넣고, 부모·형제·배우자·연인·자녀 같은 가족과 사적 관계도 포함한다(rel 예: 부부, 사별한 부부, 이혼한 부부, 첫사랑, 부녀, 의절한 형제). 이미 확정된 관계를 그대로 반복하지 말고, 새로 정한 관계나 관계의 새로운 국면만 넣는다. a와 b는 이 문서의 제목이거나 이 문서가 링크한 항목의 제목을 글자 그대로 쓴다. 인물이 아닌 항목만 다룬 문서라면 빈 배열.
categories는 위키 하단의 분류처럼 쓴다(예: "1931년 출생", "○○ 출신 인물", "△△의 조직"). 링크 없이 짧게. sections의 level은 1(큰 섹션) 또는 2(바로 앞 큰 섹션의 하위 섹션)이며, 섹션 번호는 쓰지 않는다.
facts에는 이 문서가 링크한 항목 중 중요한 것(인물, 조직, 사건, 장소 위주) 6~10개에 대해 1개씩 넣되, 이 문서의 절정이나 큰 사건에 등장한 항목은 빠짐없이 포함해 그 사건에서 무엇을 했고 어떻게 되었는지(쓴 무기나 수단, 생사, 결과)를 사실로 남긴다. 그리고 「${e.title}」 자체에 대한 핵심 사실 3~6개를 넣는다. newEntities에는 위 '이미 존재하는 항목' 목록에 없던 링크 대상을 모두 넣되, summary는 40자 안팎의 한 문장으로 짧게 쓴다. timeline에는 이 문서에서 새로 확정한 사건을 1~3개 넣는다. 시간과 무관해 보이는 항목이라도 도입, 발견, 변화, 사고의 시점을 정한다. 이미 연표에 있는 사건은 다시 넣지 않는다.`;
}
/* 제목의 표기들: "白頭(백두)"는 "白頭"와 "백두"로도 찾는다 */
const namesOf = t => { const m = String(t).match(/^(.+?)\((.+)\)$/); return [t, ...(m ? [m[1].trim(), m[2].trim()] : [])].filter(x => x.length >= 2); };
function checkBrief(w, k, key) {
  const o = w.entities[k];
  const ms = o.mentions.filter(m => m.from !== key && live(m)).slice(-2).map(m => `- 「${w.entities[m.from]?.title || "?"}」의 서술: ${m.text}`);
  const rs = relationsOf(w, k).filter(x => x.src !== key && live(x)).slice(-3).map(x => "- 관계: " + relLine(w, x));
  return [entityBrief(w, k, key), ...ms, ...rs].join("\n");
}
function checkPrompt(w, key) {
  const p = S.pages[key];
  const base = [...new Set([...related(w, key), ...(p.links || [])])].filter(k => k !== key && w.entities[k]).slice(0, 10);
  const plain = [...(p.infobox || []).map(r => stripMarks(r.value)), ...p.sections.map(s => stripMarks(s.body))].join("\n");
  const named = Object.entries(w.entities).filter(([x, o]) => x !== key && !base.includes(x) && namesOf(o.title).some(n => plain.includes(n)))
    .sort((a, b) => (b[1].page ? 1 : 0) - (a[1].page ? 1 : 0)).slice(0, 8).map(([x]) => x);   // 링크 없이 이름만 나온 항목도 대조한다
  const keys = [...base, ...named];
  const ctx = keys.map(k => checkBrief(w, k, key)).join("\n\n");
  const own = [...w.entities[key].facts.filter(f => f.src !== key && live(f)).map(f => "- " + factLine(f)), ...w.entities[key].mentions.filter(m => m.from !== key && live(m)).map(m => `- 「${w.entities[m.from]?.title || "?"}」의 서술: ${m.text}`), ...relationsOf(w, key).filter(x => x.src !== key && live(x)).map(x => "- 관계: " + relLine(w, x))].join("\n");
  const text = [`# ${p.title}`, ...(p.infobox || []).map(r => `${r.label}: ${stripMarks(r.value)}`), ...p.sections.map(s => `## ${s.heading}\n${stripMarks(s.body)}`)].join("\n");
  return `다음 위키 문서가 세계관의 확정 설정과 모순되는지 검사하라. 확정 설정과 명백히 반대되는 서술만 지적하고, 단순히 새로 추가된 정보나 해석의 차이는 문제 삼지 마라.

${canonBlock({ ...w, timeline: (w.timeline || []).filter(t => t.src !== key) })}

## 이 항목에 대해 다른 문서가 확정한 사실
${own || "(없음)"}

## 관련 항목의 확정 설정
${ctx || "(없음)"}

## 검사할 문서
${text}

JSON 객체 하나만 출력: {"issues":[{"claim":"문서의 해당 서술","conflict":"충돌하는 확정 설정","severity":"high 또는 low"}]}
문제가 없으면 {"issues":[]}.`;
}

/* ---------- actions ---------- */
async function createWorld() {
  const seed = S.seed.trim();
  if (seed.length < 10) { toast("원안을 한두 문장 이상 적어 주세요."); return; }
  if (!S.sample) { S.createErr = ERR.no_sample; renderMain(); return; }
  S.creating = true; S.createErr = null; renderMain();
  try {
    const first = norm(S.first).slice(0, 60);
    const guide = String(S.guideIn || "").replace(/\r/g, "").trim().slice(0, 1000);
    const b = await callJson("bible", biblePrompt(seed, first, guide), { modelTier: "default" }, { title: first });
    if (!b || !b.title) throw { code: "invalid_json" };
    const w = { kind: "world", id: "w" + Date.now().toString(36) + Math.random().toString(36).slice(2, 6),
      title: norm(b.title).slice(0, 40), tagline: String(b.tagline || "").slice(0, 160), seed, style: "encyc",
      era: String(b.era || "미상").slice(0, 40), historical: b.historical === true || b.historical === "true", guide, tone: normTone(b.tone, ""), rules: (Array.isArray(b.rules) ? b.rules : []).map(r => stripMarks(r)).filter(Boolean).slice(0, 10),
      timeline: [], userCanon: "", entities: {}, mainKey: null, createdAt: Date.now() };
    for (const t of (Array.isArray(b.timeline) ? b.timeline : [])) addTimeline(w, t, "seed");
    const mt = first || norm(b.mainTitle || b.title);
    w.mainKey = keyOf(mt); w.entities[w.mainKey] = newEntity(mt, "", "");
    await Store.saveWorld(w);
    S.worlds.unshift(w); S.creating = false;
    S.seed = S.ownSeed = S.first = S.guideIn = ""; S.seedTab = "own"; S.dice = null; S.whatIfs = null;   // 만들고 나면 입력란을 모두 비운다
    await openWorld(w.id);
  } catch (e) { S.creating = false; S.createErr = errMsg(e); renderMain(); }
}

async function openWorld(wid, goKey) {
  const w = S.worlds.find(x => x.id === wid); if (!w) return;
  if (S.gen && S.gen.wid !== wid) { toast("다른 세계관의 문서를 작성하는 중입니다. 끝난 뒤 열어 주세요."); return; }
  S.world = w; S.pages = {}; S.recent = []; S.confirmDel = null; S.nf = new Set(); S.edit = null; S.confirmDelPage = null;
  S.view = { name: "loading" }; renderAll();
  try { S.pages = await Store.listPages(w.id); } catch (e) { toast(errMsg(e)); }
  openEntity(goKey || w.mainKey);
}

function openEntity(k) {
  const w = S.world; if (!w || !w.entities[k]) return;
  S.confirmRewrite = null; S.genErr = S.genErr && S.genErr.key === k ? S.genErr : null;
  S.view = { name: "article", key: k };
  S.recent = [k, ...S.recent.filter(x => x !== k)].slice(0, 8);
  if (!S.pages[k] && !(S.gen && S.gen.key === k) && !S.genErr) { if (S.gen) { renderAll(); toast(`「${S.gen.title}」 문서를 작성하는 중입니다. 끝나면 이 문서를 작성할 수 있습니다.`); return; } generatePage(k); return; }
  renderAll(); window.scrollTo({ top: 0 });
}

async function generatePage(k, rewrite, direction) {
  const w = S.world; const e = w.entities[k];
  if (!S.sample) { S.genErr = { key: k, msg: ERR.no_sample }; S.view = { name: "article", key: k }; renderAll(); return; }
  if (S.gen) { toast(`「${S.gen.title}」 문서를 작성하는 중입니다.`); return; }
  let backup = null, oldPage = null;
  if (rewrite) { oldPage = S.pages[k]; backup = prepareRewrite(w, k); delete S.pages[k]; }
  const ctl = new AbortController();
  S.gen = { key: k, wid: w.id, title: e.title, raw: "", t0: performance.now(), ctl, rewrite: !!rewrite, direction: direction || "" };
  S.genErr = null; S.confirmRewrite = null; S.view = { name: "article", key: k };
  renderAll(); window.scrollTo({ top: 0 });
  try {
    if (!w.tone && !w.toneTried) {
      w.toneTried = true;
      try { const t = await detectTone(w); if (t) { w.tone = t; toast(`분위기를 「${t.label}」(으)로 판별했습니다. 설정 노트에서 고칠 수 있습니다.`); } } catch {}
      if (ctl.signal.aborted) throw { code: "cancelled" };
    }
    const out = await callJson("page", pagePrompt(w, k, rewrite ? (direction || "") : null, rewrite ? "" : (direction || "")), { signal: ctl.signal, modelTier: "default", ...PAGE_MODEL, onRetry: r => { if (S.gen) { S.gen.retry = r; updateGenLive(); } }, onText: ({ text }) => { if (S.gen) { S.gen.raw = text; updateGenLive(); } } }, { title: e.title, type: TYPES.includes(e.type) ? e.type : "", ents: Object.keys(w.entities).length });
    if (out && out.notFound === true && e.src === "search") {
      S.gen = null;
      const nf = e.title;
      if (!e.facts.length && !e.mentions.length) delete w.entities[k];
      S.nf.add(k); S.recent = S.recent.filter(x => x !== k);
      if (S.view.name === "article" && S.view.key === k) { S.view = { name: "notfound", title: nf }; renderAll(); }
      else { renderSide(); toast(`‘${nf}’ 문서를 찾을 수 없습니다.`); }
      return;
    }
    autoLink(w, k, out);   // 링크가 빠진 기존 항목 이름은 조용히 링크한다
    const page = integrate(w, k, out);
    let cleared = new Set();
    if (!rewrite && direction) page.direction = direction;
    if (rewrite) { page.direction = direction || ""; page.rewrittenAt = Date.now(); cleared = clearBadges(k); }   // 직접 수정본이 사라졌으니 그 수정이 남긴 표시도 지운다
    if (S.world === w) S.pages[k] = page;
    S.gen = null;
    try { await Store.savePage(w.id, page); for (const x of cleared) if (S.pages[x] && x !== k) await Store.savePage(w.id, S.pages[x]); await Store.saveWorld(w); } catch (err) { toast("저장하지 못했습니다. " + errMsg(err)); }
    afterGen(k, true);
    if (S.world === w && S.pages[k] === page) checkPage(k, true);   // 읽는 동안 뒤에서 설정과 대조한다
  } catch (err) {
    S.gen = null;
    if (rewrite) {
      restoreRewrite(w, backup); if (S.world === w && oldPage) S.pages[k] = oldPage;
      toast(err?.code === "cancelled" ? "다시 쓰기를 취소했습니다. 이전 버전을 그대로 둡니다." : "다시 쓰지 못해 이전 버전을 그대로 둡니다. " + errMsg(err));
    }
    else if (err?.code !== "cancelled") S.genErr = { key: k, msg: errMsg(err), guide: direction || "" };
    else S.genErr = { key: k, msg: ERR.cancelled, cancelled: true, guide: direction || "" };
    afterGen(k, false);
  }
}
function afterGen(k, ok) {
  const here = S.view.name === "article" && S.view.key === k;
  if (here) renderAll(); else { renderSide(); if (ok) toast(`「${S.world.entities[k].title}」 문서가 완성되었습니다.`, { label: "열기", fn: () => openEntity(k) }); }
}

function integrate(w, key, out) {
  const e = w.entities[key];
  const sections = (Array.isArray(out?.sections) ? out.sections : []).filter(s => s && (s.body || s.heading)).map(s => ({ heading: String(s.heading || "").replace(/^#+\s*/, "").replace(/^\d+(\.\d+)*\.?\s+/, "").slice(0, 80), level: s.level === 2 ? 2 : 1, body: String(s.body || "") }));
  if (sections.length && sections[0].level === 2) sections[0].level = 1;
  if (!sections.some(s => s.body.trim())) throw { code: "bad_page" };
  const categories = (Array.isArray(out.categories) ? out.categories : []).filter(x => typeof x === "string" && x.trim()).slice(0, 8).map(x => stripMarks(x).slice(0, 40));
  const infobox = (Array.isArray(out.infobox) ? out.infobox : []).filter(r => r && r.label && r.value).slice(0, 10).map(r => ({ label: String(r.label).slice(0, 30), value: String(r.value).slice(0, 300) }));
  const type = TYPES.includes(out.type) ? out.type : (String(out.type || "").slice(0, 8) || "개념");
  const summary = stripMarks(out.summary).slice(0, 220);
  const notices = (Array.isArray(out.notices) ? out.notices : []).filter(x => typeof x === "string" && x.trim()).slice(0, 3).map(x => x.slice(0, 300));
  const hints = {}; for (const n of (Array.isArray(out.newEntities) ? out.newEntities : [])) if (n && n.title) hints[keyOf(n.title)] = n;
  const links = [];
  for (const t of [...sections.map(s => s.body), ...infobox.map(r => r.value), ...notices]) {
    for (const m of t.matchAll(LINK_RE)) {
      const tt = norm(m[1]); if (!tt) continue; const lk = keyOf(tt); if (lk === key) continue;

    })).filter(r => r.items.length);

    for (const r of rows) for (const it of r.items) for (const m of it.matchAll(LINK_RE)) {

/* ---------- 코드로 하는 교정 ---------- */
/* 본문에 이름만 나오고 링크가 빠진 기존 항목을 첫 등장 위치에서 링크한다 (생성 직후, 조용히) */
function autoLink(w, key, out) {
  if (!Array.isArray(out?.sections)) return 0;
  const linked = new Set();
  for (const t of [...out.sections.map(s => String(s?.body || "")), ...(Array.isArray(out.infobox) ? out.infobox : []).map(r => String(r?.value || ""))])
    for (const m of t.matchAll(LINK_RE)) linked.add(keyOf(norm(m[1])));
  const cands = [];
  for (const [k, o] of Object.entries(w.entities)) {
    if (k === key || linked.has(k)) continue;
    for (const n of namesOf(o.title)) if (!/^[㐀-鿿]+$/.test(n)) cands.push({ k, n, title: o.title });
  }
  cands.sort((a, b) => b.n.length - a.n.length || (b.n === b.title) - (a.n === a.title));
  const inLink = (t, i) => t.lastIndexOf("[[", i) > t.lastIndexOf("]]", i);
  let added = 0;
  for (const c of cands) {
    if (linked.has(c.k) || added >= 12) continue;
    for (const sec of out.sections) {
      if (!sec || typeof sec.body !== "string") continue;
      let i = sec.body.indexOf(c.n);
      while (i >= 0 && (inLink(sec.body, i) || /[가-힣A-Za-z0-9]/.test(sec.body[i - 1] || ""))) i = sec.body.indexOf(c.n, i + 1);
      if (i < 0) continue;
      const tag = c.n === c.title ? `[[${c.title}]]` : `[[${c.title}|${c.n}]]`;
      sec.body = sec.body.slice(0, i) + tag + sec.body.slice(i + c.n.length);
      linked.add(c.k); added++; break;
    }
  }
  return added;
}
/* 글자 모양으로 잡히는 문체 실수: 반전 대구, 10할이나 100%를 넘는 비율 */
function lintPage(p) {
  const out = [], seen = new Set();
  const texts = [p.summary || "", ...(p.infobox || []).map(r => r.value), ...(p.sections || []).map(x => x.body)].map(stripMarks);
  for (const t of texts) for (const m of t.matchAll(/[^.!?。\n]+[.!?。]?/g)) {
    const sen = m[0].trim(); if (!sen || seen.has(sen)) continue;
    if (/[가-힣A-Za-z0-9)\]'"’”]\s*(?:이|가)\s+아니라(?!고)\s*[^\s]/.test(sen) || /(?:이|가)\s+아니라(?!고),/.test(sen)) { seen.add(sen); out.push({ claim: sen.slice(0, 300), conflict: "문체 규칙: 'A가 아니라 B' 꼴의 반전 대구는 쓰지 않는다. 뜻은 살리고 대구 없이 고친다.", lint: true }); continue; }
    const r = [...sen.matchAll(/(\d+(?:\.\d+)?)\s*할(?![인당머])/g)].some(x => +x[1] > 10) || [...sen.matchAll(/(\d+(?:\.\d+)?)\s*(?:%|퍼센트)/g)].some(x => +x[1] > 100);
    if (r) { seen.add(sen); out.push({ claim: sen.slice(0, 300), conflict: "수치: 비율은 10할(100%)을 넘을 수 없다. 앞뒤 맥락에 맞는 값으로 고친다.", lint: true }); }
  }
  return out.slice(0, 6);
}

async function commitEdit(ed, out, r, conflicts, ch) {

  if (S.edit !== ed || !old) return;
  const backup = JSON.stringify({ entities: w.entities, timeline: w.timeline, navboxes: w.navboxes || {}, relations: w.relations || [], rules: w.rules });
  const touched = clearBadges(k);
  let page;
  try {
    for (const o of Object.values(w.entities)) {
      o.mentions = o.mentions.filter(m => m.from !== k);              // 링크와 언급은 수정본 기준으로 다시 계산
      for (const x of [...o.facts, ...o.mentions]) if (x.sup?.by === k) delete x.sup;   // 이전 수정이 대체했던 사실은 이번 대조 결과로 다시 정한다
    }

    (w.relations || []).forEach(x => { if (x.sup?.by === k) delete x.sup; });

    page = integrate(w, k, out);
  } catch (err) { const b = JSON.parse(backup); restoreRewrite(w, backup); w.rules = b.rules; edStatus("저장하지 못했습니다. " + esc(errMsg(err))); return; }
  Object.assign(page, { createdAt: old.createdAt, rewrittenAt: old.rewrittenAt, direction: old.direction, editedAt: Date.now(), stale: !r });
  if (r) {
    for (const o of Object.values(w.entities)) o.facts = o.facts.filter(f => f.src !== k);
    w.timeline = w.timeline.filter(x => x.src !== k);
    for (const f of (Array.isArray(r.facts) ? r.facts : [])) { if (!f || !f.fact || !f.about) continue; const fk = keyOf(f.about); if (w.entities[fk]) addFact(w.entities[fk], String(f.fact), k); }
    for (const t of (Array.isArray(r.timeline) ? r.timeline : [])) addTimeline(w, t, k);
    w.relations = (w.relations || []).filter(x => x.src !== k);
    for (const x of (Array.isArray(r.relations) ? r.relations : []).slice(0, 16)) addRelation(w, k, x);
    for (const n of (Array.isArray(r.newEntities) ? r.newEntities : [])) {

  // 충돌 처리: AI 문서는 자동으로 대체, 직접 정한 설정은 사용자 선택에 따른다

    if (c.kind === "rule") { if (ch.rules?.[c.id] && w.rules[c.i] !== undefined) { w.rules[c.i] = ch.rules[c.id]; ruled++; } else pending.push(c); continue; }
    if (c.kind === "canon") { pending.push(c); continue; }
    if (c.ask && !ch.keep?.[c.id]) { pending.push(c); continue; }
    const target = c.f || c.m || c.t || c.l;
    if (!target) continue;
    target.sup = { by: k };
    if (c.src && c.src !== "seed") badge(w, c.src, k, c, touched);
    if (!c.ask) auto++;

  page.pending = pending.map(c => ({ label: conflictLabel(w, c), old: c.old, claim: c.claim }));
  cleanupOrphans(w, k);
  S.pages[k] = page; S.edit = null; renderAll(); window.scrollTo({ top: 0 });
  try {
    await Store.savePage(w.id, page);
    for (const x of touched) if (S.pages[x]) await Store.savePage(w.id, S.pages[x]);
    await Store.saveWorld(w);
  } catch (err) { toast("저장하지 못했습니다. " + errMsg(err)); return; }
  const parts = [];
  if (!r) parts.push("설정과 대조하지 않았습니다");
  if (auto) parts.push(`다른 문서의 서술 ${auto}곳을 이 수정으로 대체하고 표시했습니다`);
  if (ruled) parts.push(`핵심 규칙 ${ruled}개를 고쳤습니다`);
  if (pending.length) parts.push(`해결하지 않은 충돌 ${pending.length}건이 남아 있습니다`);

}

/* ---------- rendering: text ---------- */
function linkHtml(target, label) {
  const w = S.world; const t = norm(target); const k = keyOf(t);
  const e = w && w.entities[k]; const has = !!S.pages[k];
  const tip = has ? (e?.summary || t) : "아직 작성되지 않은 문서입니다. 누르면 바로 작성하고, 두 번 누르거나(PC) 길게 누르면(모바일) 방향을 정해 작성합니다.";
  return `<a class="wl${has ? "" : " new"}" href="#" data-k="${k}" data-t="${esc(t)}" title="${esc(tip)}">${esc(label || t)}</a>`;
}
function inline(raw) {
  let out = "", last = 0;
  for (const m of raw.matchAll(LINK_RE)) { out += fmt(raw.slice(last, m.index)) + linkHtml(m[1], m[2]); last = m.index + m[0].length; }
  out += fmt(raw.slice(last));
  return out.replace(/\u0001(\d+)\u0002/g, (m, n) => `<sup class="fn"><a href="#fn-${n}" id="fnr-${n}" data-fn="${n}">[${n}]</a></sup>`);
}
const fmt = s => esc(s).replace(/\*\*([^*]+)\*\*/g, "<strong>$1</strong>").replace(/~~([^~]+)~~/g, "<del>$1</del>");
function extractFootnotes(src, fns) {
  let text = "", i = 0;
  while (i < src.length) {
    if (src[i] === "[" && src[i + 1] === "*") { let d = 1, j = i + 2; while (j < src.length && d > 0) { if (src[j] === "[") d++; else if (src[j] === "]") d--; j++; } if (d === 0) { fns.push(src.slice(i + 2, j - 1).trim()); text += "\u0001" + fns.length + "\u0002"; i = j; continue; } }
    text += src[i]; i++;
  }
  return text;
}
function blocks(body, fns) {
  const text = extractFootnotes(String(body), fns);
  let html = "";
  for (const blk of text.split(/\n{2,}/)) {
    const lines = blk.split("\n").map(l => l.replace(/\s+$/, "")).filter(l => l.trim());
    let para = [], list = [], quote = [];
    const flushP = () => { if (para.length) { html += `<p>${para.map(inline).join("<br>")}</p>`; para = []; } };
    const flushQ = () => {
      if (!quote.length) return;
      let by = "";
      if (quote.length > 1 && /^[—―–-]{1,2}\s*/.test(quote[quote.length - 1])) by = quote.pop().replace(/^[—―–-]{1,2}\s*/, "");
      html += `<blockquote><div>${quote.map(inline).join("<br>")}</div>${by ? `<cite>${inline(by)}</cite>` : ""}</blockquote>`; quote = [];
    };
    const flushL = () => {
      if (!list.length) return;
      html += `<ul>${list.map(it => `<li>${inline(it.t)}${it.kids.length ? `<ul>${it.kids.map(k => `<li>${inline(k)}</li>`).join("")}</ul>` : ""}</li>`).join("")}</ul>`;
      list = [];
    };
    for (const l of lines) {
      const lm = l.match(/^(\s*)(?:[-*•]|--)\s+(.*)$/);
      if (lm) {
        flushP(); flushQ();
        const sub = lm[1].replace(/\t/g, "  ").length >= 2 || /^\s*--\s/.test(l);
        if (sub && list.length) list[list.length - 1].kids.push(lm[2]); else list.push({ t: lm[2], kids: [] });
      }
      else if (/^\s*>\s?/.test(l)) { flushP(); flushL(); quote.push(l.replace(/^\s*>\s?/, "")); }
      else if (/^#{2,4}\s+/.test(l)) { flushP(); flushL(); flushQ(); html += `<h3>${inline(l.replace(/^#+\s+/, ""))}</h3>`; }
      else { flushL(); flushQ(); para.push(l.trim()); }
    }
    flushP(); flushL(); flushQ();
  }
  return html;
}

function readGsetForm() {

  saveGS(); S.sample = gReady() ? gemini : null;
}
function setGres(t) { S.gres = t; const el = $("#gRes"); if (el) el.textContent = t; }

function renderMain(force) {
  const m = $("#main");
  if (S.ready && S.view.name === "article" && S.edit && S.edit.key === S.view.key && S.pages[S.view.key]) {
    if (!force && m.dataset.ed === S.edit.key) return;   // 편집 중에는 다른 갱신으로 입력란을 다시 그리지 않는다
    m.innerHTML = editHtml(S.view.key); m.dataset.ed = S.edit.key; return;
  }
  m.dataset.ed = "";
  if (!S.ready || S.view.name === "loading") { m.innerHTML = `<div class="sheet"><p class="note">불러오는 중…</p><div class="sk"></div><div class="sk"></div><div class="sk"></div></div>`; return; }
  if (S.view.name === "home") m.innerHTML = homeHtml();
  else if (S.view.name === "canon") m.innerHTML = canonHtml();
  else if (S.view.name === "notfound") m.innerHTML = notFoundHtml(S.view.title);
  else if (S.view.name === "log") m.innerHTML = logHtml();
  else if (S.view.name === "gset") m.innerHTML = gsetHtml();
  else if (S.view.name === "fix") m.innerHTML = fixvHtml(S.view.key);
  else if (S.view.name === "compose") m.innerHTML = composeHtml(S.view.key);
  else m.innerHTML = articleHtml(S.view.key);
  if (S.view.name === "canon" && S.focusEnt) { const d = document.getElementById("ent-" + S.focusEnt); if (d) { d.open = true; d.scrollIntoView({ block: "center" }); } S.focusEnt = null; }
}

  const list = S.worlds.length ? S.worlds.map(w => {
    const ents = Object.values(w.entities || {}); const done = ents.filter(e => e.page).length;
    return `<article class="wcard"><button type="button" class="open" data-world="${w.id}">${esc(w.title)}</button>
      ${w.tagline ? `<p>${esc(w.tagline)}</p>` : ""}
      <div class="wm"><span>${w.tone ? esc(w.tone.label) + " · " : ""}작중 ${esc(w.era)} · 문서 ${done} · 미작성 ${ents.length - done}</span>
      ${S.confirmDel === w.id ? `<span class="confirm">문서까지 모두 지울까요?<button type="button" class="btn dng" data-del-yes="${w.id}">삭제</button><button type="button" class="btn" data-act="del-no">취소</button></span>` : `<button type="button" class="btn" data-del="${w.id}" style="padding:2px 10px">삭제</button>`}</div></article>`;
  }).join("") : `<div class="empty">아직 만든 세계관이 없습니다. 왼쪽에 원안을 적고 <b>세계관 만들기</b>를 누르면 설정 노트와 첫 문서가 만들어집니다.</div>`;
  return `<div class="home">
    <section class="sheet">
      <h2>새 세계관 만들기</h2>
      <p class="sub">원안 몇 문장으로 위키를 엽니다. 본문의 빨간 링크를 누를 때마다 그 항목의 문서가 새로 작성되고, 앞서 확정된 설정은 설정 노트에 쌓여 다음 문서의 제약이 됩니다.</p>
      <label class="lb" for="seedTa">원안</label>
      <div class="stabs" role="tablist" aria-label="원안 고르기">${ex}</div>
      ${S.seedTab === "dice" && S.dice ? `<div class="dice" aria-label="원안 주사위">
        ${["era", "genre", "twist"].map(k => `<div class="die"><span class="die-l">${DICE_LABEL[k]}</span><span class="die-v">${esc(S.dice[k])}</span><button type="button" class="die-lock" data-lock="${k}" aria-pressed="${!!S.dice.locks[k]}" title="이 칸은 다시 굴려도 그대로 둡니다">${S.dice.locks[k] ? "고정됨" : "고정"}</button></div>`).join("")}
        <div class="row" style="margin-top:2px"><button type="button" class="btn" data-act="roll" ${S.creating ? "disabled" : ""}>다시 굴리기</button><span class="note">고정한 칸은 그대로 두고 나머지만 바꿉니다. 아래 원안을 고쳐 써도 됩니다.</span></div></div>` : ""}
      ${S.seedTab === "whatif" && S.whatIfs ? `<div class="whatif">
        <p class="note" style="margin:0 0 8px">질문을 고르면 그 질문으로 바로 세계관을 만듭니다. 아래 첫 문서와 작가 지침 칸도 함께 반영됩니다.</p>
        <div class="wi-grid">${S.whatIfs.map(q => `<button type="button" class="wi" data-whatif="${esc(q)}" ${S.creating || !S.sample ? "disabled" : ""}><span>만약</span>${esc(q)}</button>`).join("")}</div>
        <div class="row" style="margin-top:8px"><button type="button" class="btn" data-act="whatif-more" ${S.creating ? "disabled" : ""}>다른 질문 보기</button></div></div>` : ""}
      <textarea id="seedTa" rows="7" ${S.creating ? "disabled" : ""} ${S.seedTab === "whatif" ? "hidden" : ""} placeholder="어떤 세계인지 몇 문장으로 적어 주세요. 무엇이 현실과 다른지, 언제 어디가 무대인지, 누가 무엇을 두고 다투는지가 있으면 좋습니다.&#10;&#10;예: 우주력 1388년, 위화도에서 회군한 기동갑주가 왕조를 갈아치웠고, 그 왕조가 500년을 버텨 온 콜로니 국가.">${esc(S.seed)}</textarea>
      ${/^\d+$/.test(S.seedTab) ? `<p class="note" style="margin:6px 0 0">예시 원안입니다. 고쳐 쓰면 직접 작성 탭으로 옮겨집니다.</p>` : ""}
      <label class="lb" for="firstIn">첫 문서 <span class="note" style="font-weight:400">비워 두면 세계관을 대표하는 항목으로 자동 선택</span></label>
      <input id="firstIn" class="txt" type="text" maxlength="60" value="${esc(S.first)}" placeholder="예: 위화도 회군, 태조 전용기, 한양 궤도 거주구" ${S.creating ? "disabled" : ""}>
      <label class="lb" for="guideIn">작가 지침 <span class="note" style="font-weight:400">선택 · 세계관 전체에 걸쳐 지킬 방향. 모든 문서에 함께 전달됩니다</span></label>
      <textarea id="guideIn" rows="3" maxlength="1000" placeholder="예: 일본 거대 로봇 메카닉 SF풍으로. 네임드 파일럿에게는 전용기를 준다. 양산기 바리에이션을 풍부하게. 잔혹한 묘사는 피한다." ${S.creating ? "disabled" : ""}>${esc(S.guideIn)}</textarea>
      <div class="row" ${S.seedTab === "whatif" && !S.creating && !S.createErr ? "hidden" : ""}>
        <button type="button" class="btn pri" data-act="create" ${S.creating || !S.sampleReady ? "disabled" : ""}>${S.creating ? "설정 노트를 만드는 중…" : "세계관 만들기"}</button>
        ${S.creating ? `<span class="genpill"><span class="dot"></span>핵심 규칙과 연표를 정리하고 있습니다</span>` : ""}
        ${!S.sampleReady ? `<span class="note">생성 기능을 준비하는 중…</span>` : (!S.sample ? `<span class="note">${esc(ERR.no_sample)}</span>` : "")}
      </div>
      ${S.createErr ? `<div class="banner warn">${esc(S.createErr)}</div>` : ""}
      <ol class="how">
        <li><span>1</span>원안에서 핵심 규칙, 연표, 작중 기준 시점을 뽑아 설정 노트를 만듭니다.</li>
        <li><span>2</span>문서를 쓸 때 링크한 항목마다 한 줄 정의와 언급 문장을 미리 기록합니다.</li>
        <li><span>3</span>그 항목을 열면 기록된 내용을 반드시 지키도록 문서를 작성합니다.</li>
      </ol>
    </section>
    <section><h2 style="font-family:var(--f-display);font-size:18px;margin:4px 0 12px">내 세계관</h2><div class="wlist">${list}</div></section>
  </div>`;
}

function articleHtml(k) {
  const w = S.world, e = w.entities[k], p = S.pages[k];
  if (!e) return `<div class="sheet"><p>문서를 찾을 수 없습니다.</p></div>`;
  const crumb = `<div class="crumb"><span>${esc(w.title)}</span><span>작중 기준 ${esc(w.era)}</span>${e.type ? `<span>분류: ${esc(e.type)}</span>` : ""}${p ? `<span>작성 ${fmtDate(p.createdAt)}</span>` : ""}${p?.editedAt ? `<span>직접 수정 ${fmtDate(p.editedAt)}</span>` : ""}</div>`;
  if (S.gen && S.gen.key === k) {
    return `<div class="sheet">${crumb}<h1 class="t">${esc(e.title)}</h1>
      <div class="gen-live"><span class="dot"></span><span id="genCount">문서를 작성하는 중</span><button type="button" class="btn" data-act="stop">작성 중단</button></div>
      ${S.gen.direction ? `<p class="src" style="margin:10px 0 0">${S.gen.rewrite ? "다시 쓰기" : "작성"} 방향: ${esc(S.gen.direction)}</p>` : ""}
      ${promiseHtml(w, e, "이 문서가 지켜야 할 확정 내용")}
      <ul class="heads" id="genHeads"></ul>
      <div style="margin-top:14px"><div class="sk"></div><div class="sk"></div><div class="sk"></div><div class="sk"></div></div></div>`;
  }
  if (!p) {
    const er = S.genErr && S.genErr.key === k ? S.genErr : null;
    return `<div class="sheet">${crumb}<h1 class="t">${esc(e.title)}</h1>
      ${er ? `<div class="banner warn">${esc(er.msg)}</div>` : `<p class="note">아직 작성되지 않은 문서입니다.</p>`}
      ${promiseHtml(w, e, "이미 확정된 내용")}
      <div class="tools"><button type="button" class="btn pri" data-gen="${k}" ${S.gen || !S.sample ? "disabled" : ""}>이 문서 작성하기</button><button type="button" class="btn" data-compose="${k}">방향을 정해 작성</button></div></div>`;
  }
  const fns = [];
  const box = p.infobox?.length ? `<aside class="infobox"><div class="ih">${esc(p.title)}</div><div class="ity">${esc(p.type)}</div><table>${p.infobox.map(r => `<tr><th>${esc(r.label)}</th><td>${blocks(r.value, fns).replace(/^<p>|<\/p>$/g, "")}</td></tr>`).join("")}</table></aside>` : "";
  let n1 = 0, n2 = 0;
  const nums = p.sections.map(s => { if ((s.level || 1) === 2 && n1) { n2++; return `${n1}.${n2}.`; } n1++; n2 = 0; return `${n1}.`; });
  const secs = p.sections.map((s, i) => { const sub = nums[i].split(".").length > 2; return `<${sub ? "h3" : "h2"} id="s-${i}" class="${sub ? "sh" : ""}"><span class="n">${nums[i]}</span>${esc(s.heading)}</${sub ? "h3" : "h2"}>${blocks(s.body, fns)}`; }).join("");
  const toc = p.sections.length > 2 ? `<nav class="toc" aria-label="목차"><b>목차</b><ul>${p.sections.map((s, i) => `<li class="${nums[i].split(".").length > 2 ? "sub" : ""}"><span class="n">${nums[i]}</span> <button type="button" data-sec="${i}">${esc(s.heading)}</button></li>`).join("")}</ul></nav>` : "";
  const fnHtml = fns.length ? `<section class="fns"><b>각주</b><ol>${fns.map((f, i) => `<li id="fn-${i + 1}">${inline(f)}</li>`).join("")}</ol></section>` : "";
  const back = [...new Set(e.mentions.map(m => m.from))].filter(x => w.entities[x] && x !== k);
  const out = (p.links || []).filter(x => w.entities[x]);
  const newOut = out.filter(x => !S.pages[x]).length;
  const chk = p.check;
  const hi = (chk?.issues || []).filter(i => i.severity === "high"), lo = [...(chk?.issues || []).filter(i => i.severity !== "high"), ...lintPage(p)];
  S.memo = { k, items: [...hi, ...lo] };
  const fixBtn = n => `<button type="button" class="btn memo-fix" data-fix="${n}" data-fixk="${k}" ${S.fixing || (S.gen && S.gen.key === k) || !S.sample ? "disabled" : ""}>${S.fixing && S.fixing.key === k && S.fixing.i === n ? "고치는 중…" : "고치기"}</button>`;
  const item = (i, n, cls) => `<li class="${cls}">${esc(i.claim)}${i.conflict ? `<span class="memo-why">${esc(i.conflict)}</span>` : ""}${fixBtn(n)}</li>`;
  const chkHtml = (S.checking === k || S.bgSync === k) ? `<p class="memo-line"><span class="dot"></span>설정 노트와 맞춰 보는 중</p>`
    : (hi.length || lo.length) ? `<details class="memo"${hi.length ? " open" : ""}><summary><span class="memo-dot${hi.length ? " on" : ""}"></span>편집자 메모${hi.length ? ` · 다듬을 곳 ${hi.length}` : ""}${lo.length ? ` · 참고 ${lo.length}` : ""}${chk ? `<span class="src">${fmtDate(chk.at)}</span>` : ""}</summary><ul>${hi.map((i, n) => item(i, n, "")).join("")}${lo.map((i, n) => item(i, hi.length + n, "lo")).join("")}</ul>${hi.length + lo.length > 1 ? `<div class="memo-foot"><button type="button" class="btn" data-act="fixv-open" ${S.gen && S.gen.key === k ? "disabled" : ""}>여러 곳 한꺼번에 교정하기</button></div>` : ""}</details>`
    : chk ? `<p class="memo-line">설정 노트와 맞춰 봤습니다 <span class="src">${fmtDate(chk.at)}</span></p>` : "";
  const rw = `<button type="button" class="btn" data-rw="${k}" aria-expanded="${S.confirmRewrite === k}" ${S.gen || !S.sample ? "disabled" : ""}>다시 쓰기</button>`;
  const binding = e.mentions.filter(m => m.from !== k).length + e.facts.filter(f => f.src !== k).length;
  const rwBox = S.confirmRewrite === k ? `<div class="rwbox">
      <label class="lb" for="rwDir">다시 쓰기 방향 <span class="note" style="font-weight:400">선택</span></label>
      <input id="rwDir" class="txt" type="text" maxlength="300" placeholder="예: 생애는 줄이고 위화도 회군 전투를 중심으로, 분량은 절반 정도">
      <p class="note">이 문서의 이전 버전과 이전 버전이 확정한 사실은 참고하지 않고 새로 씁니다. 다른 문서가 이 항목에 대해 확정한 내용 ${binding}건은 그대로 지킵니다.${p.editedAt ? " 직접 수정한 내용도 사라집니다." : ""} 실패하거나 중단하면 이전 버전이 유지됩니다.</p>
      <div class="row" style="margin-top:6px"><button type="button" class="btn pri" data-rw-yes="${k}">다시 쓰기</button><button type="button" class="btn" data-act="rw-no">취소</button></div>
    </div>` : "";
  return `<article class="sheet">${crumb}<h1 class="t">${esc(p.title)}</h1>
    ${p.categories?.length ? `<div class="cats"><b>분류</b>${p.categories.map(c => `<span>${esc(c)}</span>`).join("")}</div>` : ""}
    ${navboxesFor(w, k).map(([, nb]) => navboxHtml(nb, nb.src === k, k)).join("")}
    <div class="tools"><button type="button" class="btn" data-edit="${k}">편집</button><button type="button" class="btn" data-check="${k}" ${S.checking || !S.sample ? "disabled" : ""}>설정 검사</button>${rw}<button type="button" class="btn" data-focus="${k}">설정 노트에서 보기</button><button type="button" class="btn dng" data-delpage="${k}" aria-expanded="${S.confirmDelPage === k}">삭제</button></div>
    ${S.confirmDelPage === k ? `<div class="rwbox"><p style="margin:0">「${esc(p.title)}」 문서를 삭제할까요?</p>
      <p class="note">문서와 이 문서가 확정한 사실, 틀, 연표 항목이 지워집니다. 다른 문서가 이 항목을 언급한 내용은 남고, 그 링크는 미작성 문서로 돌아갑니다. 되돌릴 수 없습니다.</p>
      <div class="row" style="margin-top:6px"><button type="button" class="btn dng" data-delpage-yes="${k}">삭제</button><button type="button" class="btn" data-act="delpage-no">취소</button></div></div>` : ""}
    ${p.stale ? `<div class="banner warn">직접 수정한 내용을 설정과 대조하지 못해, 설정 노트에 이전 버전의 사실이 남아 있을 수 있습니다. <button type="button" class="btn" data-refresh="${k}" style="margin-left:6px;padding:2px 10px" ${!S.sample ? "disabled" : ""}>설정과 대조해 다시 저장</button></div>` : ""}
    ${p.conflicts?.length ? `<div class="banner warn"><b>「${esc(p.conflicts[0].byTitle)}」${p.conflicts.some(c => c.byTitle !== p.conflicts[0].byTitle) ? " 등" : ""} 문서가 직접 수정되어, 이 문서의 서술 ${p.conflicts.length}곳이 설정과 맞지 않습니다.</b>
      <ul>${p.conflicts.map(c => `<li>${esc(c.old)} <span class="src">→ ${linkHtml(c.byTitle)}: ${esc(c.claim)}</span></li>`).join("")}</ul>
      <div class="row" style="margin-top:4px"><button type="button" class="btn" data-edit="${k}">편집해서 고치기</button><button type="button" class="btn" data-rw="${k}" ${S.gen || !S.sample ? "disabled" : ""}>다시 쓰기</button><button type="button" class="btn" data-dismiss="${k}" data-field="conflicts">표시 지우기</button></div></div>` : ""}
    ${p.pending?.length ? `<div class="banner warn"><b>이 문서의 수정 내용이 직접 정한 설정과 충돌한 채 저장되었습니다.</b>
      <ul>${p.pending.map(c => `<li><span class="sev">${esc(c.label)}</span>${esc(c.old)} <span class="src">↔ 수정본: ${esc(c.claim)}</span></li>`).join("")}</ul>
      <div class="row" style="margin-top:4px"><button type="button" class="btn" data-edit="${k}">편집</button><button type="button" class="btn" data-act="canon">설정 노트 열기</button><button type="button" class="btn" data-dismiss="${k}" data-field="pending">표시 지우기</button></div></div>` : ""}
    ${rwBox}${chkHtml}
    ${p.rewrittenAt ? `<p class="src" style="margin:8px 0 0">${fmtDate(p.rewrittenAt)} 다시 씀${p.direction ? ` · 방향: ${esc(p.direction)}` : ""}</p>` : p.direction ? `<p class="src" style="margin:8px 0 0">작성 방향: ${esc(p.direction)}</p>` : ""}
    <div class="article">${p.notices?.length ? `<div class="notice">${p.notices.map(n => `<div>${blocks(n, fns).replace(/^<p>|<\/p>$/g, "")}</div>`).join("")}</div>` : ""}${box}${toc}${secs}${fnHtml}</div>
    ${(() => {

  $("#q").value = ""; renderSugg(); $("#q").blur(); openCompose(k);
}
function goSearch(title) {
  const w = S.world; const t = norm(title); if (!w || !t) return;
  const k = keyOf(t);
  if (!w.entities[k] && S.nf.has(k)) { $("#q").value = ""; renderSugg(); $("#q").blur(); S.view = { name: "notfound", title: t }; renderAll(); window.scrollTo({ top: 0 }); return; }
  if (!w.entities[k]) { w.entities[k] = newEntity(t, "", ""); w.entities[k].src = "search"; }
  $("#q").value = ""; renderSugg(); $("#q").blur(); openEntity(k);
}

/* ---------- toast ---------- */
let toastT;
function toast(msg, action) {
  const t = $("#toast"); t.innerHTML = esc(msg) + (action ? `<button type="button" id="toastAct">${esc(action.label)}</button>` : "");
  t.hidden = false; if (action) $("#toastAct").onclick = () => { t.hidden = true; action.fn(); };
  clearTimeout(toastT); toastT = setTimeout(() => { t.hidden = true; }, action ? 7000 : 3600);
}

/* ---------- events ---------- */
document.addEventListener("click", ev => {
  if (!ev.target.closest(".search")) $("#sugg").hidden = true;
  const el = ev.target.closest("button, a"); if (!el) return;
  const d = el.dataset;
  if (el.matches("a.wl.new")) {
    ev.preventDefault();
    if (lp.fired) { lp.fired = false; return; }               // 길게 누르기로 이미 작성 페이지를 열었음
    const w = S.world; if (!w) return;
    const k = d.k; if (!w.entities[k] && d.t) w.entities[k] = newEntity(d.t, "", "");
    if (lp.touch) { openEntity(k); return; }                   // 터치는 짧게 누르면 바로 작성
    if (ev.detail >= 2) { clearTimeout(lp.clickT); lp.clickT = null; openCompose(k); return; }
    clearTimeout(lp.clickT); lp.clickT = setTimeout(() => { lp.clickT = null; openEntity(k); }, 260);
    return;
  }
  if (el.matches("a.wl") || (el.tagName === "BUTTON" && d.k)) { ev.preventDefault(); const w = S.world; if (!w) return; let k = d.k; if (!w.entities[k] && d.t) w.entities[k] = newEntity(d.t, "", ""); openEntity(k); return; }
  if (d.fn) { ev.preventDefault(); const li = document.getElementById("fn-" + d.fn); if (li) { li.scrollIntoView({ block: "center", behavior: "smooth" }); li.classList.add("flash"); setTimeout(() => li.classList.remove("flash"), 1600); } return; }
  if (d.sec) { document.getElementById("s-" + d.sec)?.scrollIntoView({ behavior: "smooth" }); return; }
  if (d.sk) { $("#q").value = ""; $("#sugg").hidden = true; openEntity(d.sk); return; }
  if (d.snew) { goSearch(d.snew); return; }
  if (d.scompose) { composeFromSearch(d.scompose); return; }
  if (d.compose) { openCompose(d.compose); return; }
  if (d.composeGo) { startCompose(d.composeGo); return; }
  if (d.force) { const w = S.world; if (!w) return; const t = norm(d.force), k = keyOf(t); S.nf.delete(k); if (!w.entities[k]) w.entities[k] = newEntity(t, "", ""); w.entities[k].src = "force"; S.genErr = null; openEntity(k); return; }
  if (d.stab) {
    S.seedTab = d.stab;
    if (!/^\d+$/.test(d.stab) && EXAMPLES.some(x => x.guide && x.guide === S.guideIn)) S.guideIn = "";   // 예시가 채운 작가 지침은 다른 탭으로 옮기면 비운다(직접 고친 지침은 둔다)
    if (d.stab === "own") S.seed = S.ownSeed;
    else if (d.stab === "dice") { if (!S.dice) rollDice(); S.seed = diceSeed(S.dice); }
    else if (d.stab === "whatif") { if (!S.whatIfs) S.whatIfs = shuffle(WHATIFS).slice(0, 8); }
    else { const ex = EXAMPLES[+d.stab]; S.seed = ex.text; if (ex.guide && (!S.guideIn.trim() || EXAMPLES.some(x => x.guide === S.guideIn))) S.guideIn = ex.guide; }   // 작가 지침은 비어 있거나 다른 예시의 것일 때만 채운다
    renderMain(); return;
  }
  if (d.lock) { S.dice.locks[d.lock] = !S.dice.locks[d.lock]; renderMain(); return; }
  if (d.whatif) { S.seed = whatIfSeed(d.whatif); createWorld(); return; }
  if (d.world) { openWorld(d.world); return; }
  if (d.del) { S.confirmDel = d.del; renderMain(); return; }
  if (d.delYes) { deleteWorld(d.delYes); return; }
  if (d.gen) { const g = S.genErr?.key === d.gen ? S.genErr.guide || "" : ""; S.genErr = null; generatePage(d.gen, false, g); return; }
  if (d.rw) { S.confirmRewrite = S.confirmRewrite === d.rw ? null : d.rw; renderMain(); if (S.confirmRewrite) $("#rwDir")?.focus(); return; }
  if (d.rwYes) { const dir = norm($("#rwDir")?.value || "").slice(0, 300); generatePage(d.rwYes, true, dir); return; }
  if (d.check) { checkPage(d.check); return; }
  if (d.fixk) { openFixView(d.fixk, [Number(d.fix)], true); return; }
  if (d.edit) { openEditor(d.edit); return; }
  if (d.delpage) { S.confirmDelPage = S.confirmDelPage === d.delpage ? null : d.delpage; S.confirmRewrite = null; renderMain(); return; }
  if (d.delpageYes) { deletePage(d.delpageYes); return; }
  if (d.refresh) { openEditor(d.refresh); saveEdit(); return; }
  if (d.dismiss) { dismissNotes(d.dismiss, d.field); return; }
  if (d.focus) { S.focusEnt = d.focus; S.view = { name: "canon" }; renderAll(); return; }
  if (d.filter) { S.canonFilter = d.filter; renderMain(); return; }
  switch (d.act) {
    case "home": if (S.view.name === "home") return; S.view = { name: "home" }; if (!S.gen) S.world = null; renderAll(); window.scrollTo({ top: 0 }); break;
    case "fixv-open": { const k = S.view.key, m = S.memo; if (m && m.k === k) openFixView(k, m.items.map((x, i) => i).filter(i => m.items[i].severity === "high"), false); break; }
    case "fixv-run": runFixBatch(); break;
    case "fixv-apply": applyFix(); break;
    case "fixv-redo": if (S.fixv) { S.fixv.phase = "pick"; S.fixv.edits = []; S.fixv.err = ""; renderMain(); } break;
    case "fixv-back": { const k = S.fixv?.key || S.view.key; S.fixv = null; S.view = S.world && S.world.entities[k] ? { name: "article", key: k } : { name: "home" }; renderAll(); break; }
    case "log": S.view = { name: "log" }; renderAll(); window.scrollTo({ top: 0 }); break;
    case "gset": S.view = { name: "gset" }; S.gres = ""; renderAll(); window.scrollTo({ top: 0 }); break;
    case "gkey-show": { const i = $("#" + (d.for || "gKey")); if (i) i.type = i.type === "password" ? "text" : "password"; break; }
    case "gset-save": readGsetForm(); setGres(""); renderSide(); toast(gReady() ? "Gemini 설정을 저장했습니다." : (gRelay() ? "중계 서버 주소나 접속 암호가 비어 있어 생성 기능이 꺼집니다." : "키가 비어 있어 생성 기능이 꺼집니다.")); renderMain(); break;
    case "relay-invite": {
      readGsetForm();
      const link = location.origin + location.pathname + (GS.relay !== DEFAULT_RELAY ? "#relay=" + encodeURIComponent(GS.relay) : "");
      (navigator.clipboard?.writeText(link) || Promise.reject()).then(() => toast("사이트 링크를 복사했습니다. 접속 암호는 따로 알려 주세요."), () => setGres("사이트 링크: " + link));
      break;
    }
    case "gset-test": (async () => {
      readGsetForm(); renderSide(); if (!gReady()) { setGres(gRelay() ? "중계 서버 주소와 접속 암호를 먼저 넣어 주세요." : "키를 먼저 넣어 주세요."); return; }
      const out = [];
      for (const tier of ["main", "quick"]) {
        setGres([...out, `${GS[tier]} 시험 중…`].join(" / "));
        const t0 = performance.now();
        try { const r = await gemini.json('JSON 객체 하나만 출력: {"ok":true}', { modelTier: tier === "main" ? "default" : "quick" }); out.push(`${GS[tier]}: ${r && r.ok === true ? "성공" : "응답은 왔지만 형식이 다름"} (${((performance.now() - t0) / 1000).toFixed(1)}초)`); }
        catch (e) { out.push(`${GS[tier]}: 실패 · ${errMsg(e)}${e?.message ? " (" + e.message + ")" : ""}`); }
      }
      setGres(out.join(" / "));
    })(); break;
    case "gset-models": (async () => {
      readGsetForm(); if (!gReady()) { setGres(gRelay() ? "중계 서버 주소와 접속 암호를 먼저 넣어 주세요." : "키를 먼저 넣어 주세요."); return; }
      setGres("모델 목록을 불러오는 중…");
      try { S.gmodels = await listGeminiModels(); S.gres = `텍스트 생성 모델 ${S.gmodels.length}개를 불러왔습니다. 모델 칸을 누르면 고를 수 있습니다.`; renderMain(); }
      catch (e) { setGres("불러오지 못했습니다. " + errMsg(e)); }
    })(); break;
    case "export": exportAll().catch(e => toast("내보내지 못했습니다. " + errMsg(e))); break;
    case "import": $("#importFile")?.click(); break;
    case "log-back": S.view = S.world ? { name: "article", key: (S.recent.find(x => S.world.entities[x]) || S.world.mainKey) } : { name: "home" }; renderAll(); break;
    case "log-clear": LOG.length = 0; try { localStorage.removeItem(LOGK); } catch {} renderAll(); break;
    case "prompt-copy": {
      if (!LASTP) break;
      const pick = () => { const d = $("#promptPre")?.closest("details"); if (d) d.open = true; const pre = $("#promptPre"); if (!pre) return; const r = document.createRange(); r.selectNodeContents(pre); const sel = getSelection(); sel.removeAllRanges(); sel.addRange(r); };
      try { navigator.clipboard.writeText(LASTP.text).then(() => toast("프롬프트를 복사했습니다."), () => { pick(); toast("자동 복사가 막혀 있어 프롬프트를 선택해 두었습니다. 직접 복사해 주세요."); }); }
      catch { pick(); toast("자동 복사가 막혀 있어 프롬프트를 선택해 두었습니다. 직접 복사해 주세요."); }
      break;
    }
    case "log-copy": {
      const txt = logText();
      const pick = () => { const pre = $("#logPre"); if (!pre) return; const r = document.createRange(); r.selectNodeContents(pre); const sel = getSelection(); sel.removeAllRanges(); sel.addRange(r); };
      try { navigator.clipboard.writeText(txt).then(() => toast("로그를 복사했습니다."), () => { pick(); toast("자동 복사가 막혀 있어 로그를 선택해 두었습니다. 직접 복사해 주세요."); }); }
      catch { pick(); toast("자동 복사가 막혀 있어 로그를 선택해 두었습니다. 직접 복사해 주세요."); }
      break;
    }
    case "canon": S.view = { name: "canon" }; renderAll(); window.scrollTo({ top: 0 }); break;
    case "create": { const ta = $("#seedTa"); if (ta) S.seed = ta.value; createWorld(); break; }
    case "stop": S.gen?.ctl.abort(); break;
    case "del-no": S.confirmDel = null; renderMain(); break;
    case "rw-no": S.confirmRewrite = null; renderMain(); break;
    case "delpage-no": S.confirmDelPage = null; renderMain(); break;
    case "ed-save": saveEdit(); break;
    case "ed-save-raw": saveEdit(true); break;
    case "cf-apply": applyConflictChoices(); break;
    case "cf-back": if (S.edit) S.edit.pending = null; $("#edConflicts").innerHTML = ""; $("#edBody")?.focus(); break;
    case "ed-cancel": S.edit = null; renderMain(); window.scrollTo({ top: 0 }); break;
    case "save-canon": saveCanon(); break;
    case "roll": rollDice(true); S.seed = diceSeed(S.dice); renderMain(); break;
    case "whatif-more": { const shown = new Set(S.whatIfs || []); const rest = shuffle(WHATIFS.filter(q => !shown.has(q))); S.whatIfs = (rest.length >= 8 ? rest : shuffle(WHATIFS)).slice(0, 8); renderMain(); break; }
    case "compose-cancel": { const k = S.view.key; S.compose = null; if (k && S.world?.entities[k] && (S.world.entities[k].facts.length || S.world.entities[k].mentions.length)) { S.genErr = null; S.view = { name: "article", key: k }; } else { S.view = { name: "article", key: S.world.mainKey }; } renderAll(); break; }
    case "tone-detect": (async () => {
      const btn = $("#toneBtn"); if (!S.sample || !S.world) return;
      const w = S.world, label = norm($("#toneLabel")?.value || "");
      if (btn) { btn.disabled = true; btn.textContent = "만드는 중…"; }
      try {
        const t = await detectTone(w, label);
        if (!t) throw { code: "invalid_json" };
        if (S.world === w && $("#toneLabel")) { $("#toneLabel").value = t.label; $("#toneGuide").value = t.guide.join("\n"); $("#toneGuide").rows = Math.min(10, t.guide.length + 1); }
        toast("분위기 지침을 채웠습니다. '설정 저장'을 눌러야 반영됩니다.");
      } catch (err) { toast("분위기 지침을 만들지 못했습니다. " + errMsg(err)); }
      if (btn) { btn.disabled = false; btn.textContent = "지침 다시 만들기"; }
    })(); break;
  }
});
document.addEventListener("input", ev => {
  if (ev.target.id === "seedTa") {
    S.seed = S.ownSeed = ev.target.value;
    if (S.seedTab !== "own") {   // 예시나 주사위 결과를 고쳐 쓰면 내 원안이 된다
      S.seedTab = "own";
      const pos = ev.target.selectionStart; renderMain();
      const ta = $("#seedTa"); if (ta) { ta.focus(); try { ta.setSelectionRange(pos, pos); } catch {} }
    }
  }
  if (ev.target.id === "firstIn") S.first = ev.target.value;
  if (ev.target.id === "cpDir" && S.compose) S.compose.dir = ev.target.value;
  if (ev.target.id === "guideIn") S.guideIn = ev.target.value;
  if (S.fixv && ev.target.dataset?.fsel !== undefined) { const x = Number(ev.target.dataset.fsel); ev.target.checked ? S.fixv.sel.add(x) : S.fixv.sel.delete(x); renderMain(); }
  if (S.fixv && ev.target.dataset?.fon !== undefined) { const e = S.fixv.edits[Number(ev.target.dataset.fon)]; if (e) { e.on = ev.target.checked; renderMain(); } }
  if (S.fixv && ev.target.dataset?.fnew !== undefined) { const e = S.fixv.edits[Number(ev.target.dataset.fnew)]; if (e) e.new = ev.target.value; }
  if (ev.target.dataset?.ef && S.edit) S.edit.f[ev.target.dataset.ef] = ev.target.value;
  if (ev.target.id === "q") renderSugg();
});
$("#q").addEventListener("focus", renderSugg);
$("#searchForm").addEventListener("submit", ev => {
  ev.preventDefault(); const q = norm($("#q").value); if (!q || !S.world) return;
  const hit = Object.entries(S.world.entities).find(([, o]) => o.title.toLowerCase() === q.toLowerCase());
  if (hit) { $("#q").value = ""; $("#sugg").hidden = true; openEntity(hit[0]); } else goSearch(q);
});
document.addEventListener("change", ev => {
  if (ev.target.id === "cpType" && S.compose) S.compose.type = ev.target.value;
  if (ev.target.id === "gMode") { const r = ev.target.value === "relay"; $("#gKeyBox").hidden = r; $("#gRelayBox").hidden = !r; }
  if (ev.target.id === "importFile" && ev.target.files?.[0]) { const f = ev.target.files[0]; ev.target.value = ""; importAll(f); }
});
/* 길게 누르기 감지: 터치로 빨간 링크를 0.5초 누르면 작성 페이지 */
const lp = { timer: null, fired: false, touch: false, x: 0, y: 0, clickT: null };
document.addEventListener("pointerdown", ev => {
  lp.touch = ev.pointerType === "touch" || ev.pointerType === "pen"; lp.fired = false;
  const a = ev.target.closest?.("a.wl.new"); clearTimeout(lp.timer);
  if (!a || !lp.touch) return;
  lp.x = ev.clientX; lp.y = ev.clientY;
  lp.timer = setTimeout(() => {
    const w = S.world; if (!w) return;
    const k = a.dataset.k; if (!w.entities[k] && a.dataset.t) w.entities[k] = newEntity(a.dataset.t, "", "");
    lp.fired = true; lp.firedAt = Date.now(); try { navigator.vibrate?.(15); } catch {}
    openCompose(k);
  }, 500);
});
document.addEventListener("pointermove", ev => { if (lp.timer && Math.hypot(ev.clientX - lp.x, ev.clientY - lp.y) > 10) { clearTimeout(lp.timer); lp.timer = null; } });
["pointerup", "pointercancel"].forEach(t => document.addEventListener(t, () => { clearTimeout(lp.timer); lp.timer = null; }));
document.addEventListener("click", ev => {   // 길게 누른 뒤 손을 뗄 때 생기는 클릭이 작성 페이지의 버튼을 누르지 않게 한다
  if (lp.fired && Date.now() - (lp.firedAt || 0) < 900) { ev.stopPropagation(); ev.preventDefault(); lp.fired = false; }
}, true);
document.addEventListener("contextmenu", ev => { if (ev.target.closest?.("a.wl.new")) ev.preventDefault(); });
document.addEventListener("keydown", ev => { if (ev.key === "Escape") $("#sugg").hidden = true; });

/* ---------- boot ---------- */
(async function boot() {
  renderAll();
  setInterval(() => { if (S.gen) updateGenLive(); const t = $("#fxTick"); if (t && S.fixv?.t0) t.textContent = Math.floor((performance.now() - S.fixv.t0) / 1000) + "초"; }, 1000);
  const inv = /(?:^#|&)relay=([^&]+)/.exec(location.hash || "");   // 초대 링크(#relay=주소)로 들어오면 중계 서버 주소를 채운다
  let invited = false;
  if (inv) { const u = normRelay(decodeURIComponent(inv[1])); if (/^https:\/\//i.test(u)) { const same = GS.mode === "relay" && GS.relay === u; GS = { ...GS, mode: "relay", relay: u, pass: same ? GS.pass : "" }; saveGS(); invited = !GS.pass; } history.replaceState(null, "", location.pathname + location.search); }
  S.sample = gReady() ? gemini : null; S.sampleReady = true;
  await Store.init();
  try { S.worlds = (await Store.listWorlds()).sort((a, b) => (b.updatedAt || 0) - (a.updatedAt || 0)); }
  catch (e) { toast("세계관 목록을 불러오지 못했습니다. " + errMsg(e)); }
  S.ready = true; S.view = gReady() ? { name: "home" } : { name: "gset" };
  if (invited) S.gres = "초대 링크로 중계 서버 주소가 채워졌습니다. 받은 접속 암호를 넣고 저장해 주세요.";
  renderAll();
})();
})();
