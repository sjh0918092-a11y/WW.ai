<!doctype html><html><head><meta charset=utf8><meta name=viewport content="width=device-width,initial-scale=1,viewport-fit=cover"><style>:root{color-scheme:light;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}html{scroll-padding-top:env(safe-area-inset-top,0px)}body{margin:0;padding:0;font:14px -apple-system,BlinkMacSystemFont,sans-serif;background:#fff;color:#000}img{max-width:100%}[hidden]:not([hidden=until-found i]){display:none!important}</style></head><body>
<title>WorldWiki.ai</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500&family=IBM+Plex+Sans+KR:wght@400;500;600&family=Noto+Serif+KR:wght@600;700&display=swap">
<link rel="stylesheet" href="css/style.css">

<header class="top wrap">
  <div class="top-in">
    <button class="brand" id="brand" data-act="home" type="button"><b>WorldWiki.ai</b><span id="brandWorld" hidden></span></button>
    <form class="search" id="searchForm" autocomplete="off" role="search">
      <input id="q" type="search" placeholder="세계관을 열면 검색할 수 있습니다" aria-label="문서 검색 또는 새 문서 만들기" disabled>
      <button type="button" class="discovery-button" id="discoveryBtn" aria-label="랜덤 서핑" title="새 문서 랜덤 생성 · 길게 누르거나 두 번 누르면 내용 지정" disabled><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M3 6h3c5 0 7 12 12 12h3M17 14l4 4-4 4M3 18h3c2.5 0 4.3-3 6-6s3.5-6 6-6h3M17 2l4 4-4 4"/></svg></button>
      <div class="sugg" id="sugg" hidden></div>
    </form>
  </div>
</header>
<div class="wrap"><div class="shell" id="shell">
  <nav class="side" id="side" aria-label="세계관 탐색"></nav>
  <main id="main"><div class="sheet"><p class="note">불러오는 중…</p></div></main>
</div></div>
<div class="toast" id="toast" hidden></div>
<div class="ver" id="appVer" aria-hidden="true"></div>

<script src="js/core.js"></script>
<script src="js/gemini.js"></script>
<script src="js/storage.js"></script>
<script src="js/state.js"></script>
<script src="js/story-model.js"></script>
<script src="js/prompts.js"></script>
<script src="js/actions.js"></script>
<script src="js/consistency.js"></script>
<script src="js/fix.js"></script>
<script src="js/edit-source.js"></script>
<script src="js/prose.js"></script>
<script src="js/images.js"></script>
<script src="js/editor.js"></script>
<script src="js/story.js"></script>
<script src="js/render.js"></script>
<script src="js/story-view.js"></script>
<script src="js/discovery.js"></script>
<script src="js/events.js"></script>
<script src="js/link-select.js"></script>
<script src="js/boot.js"></script>


</body></html>
